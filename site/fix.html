/*HEAD*/
<style>
  /* A fix page: one package of changes, the places it would let people bike to (an "across" page: by side of the street). Colors map onto maxmautner.com's tokens (site.css), as on the
     place pages, so the dark-mode toggle works. */
  :root { --ink: var(--text); --body: var(--text-2); --grey: var(--text-3); --faint: var(--surface-sunken);
          --copper: var(--accent); --card: var(--surface); --can: #2f7d5b; --fix: #2b59c3; --plan: #2f7f73;
          --g0: #2b59c3; --g1: #b5562b; --quiet: #c9c3b8; --busy: #8a8378; }
  :root[data-theme="dark"] { --can: #5cb98d; --fix: #7c9cf0; --plan: #4fb3a4; --g0: #7c9cf0; --g1: #e08a5c; --quiet: #4a463f; --busy: #8f887c; }
  html, body { overflow-x: hidden; }
  main.bp { max-width: 1060px; margin: 0 auto; padding: 0 20px 48px; font-family: var(--font-sans); color: var(--body); }
  main.bp [hidden] { display: none !important; }
  .crumb { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--grey); margin: 8px 0 6px; }
  .crumb a { color: inherit; }
  main.bp h1 { font-family: var(--font-serif); font-weight: 600; color: var(--ink); font-size: clamp(30px, 5vw, 44px); line-height: 1.1; margin: 0 0 14px; text-wrap: balance; max-width: 22ch; }
  main.bp h2 { font-family: var(--font-serif); font-weight: 600; color: var(--ink); font-size: 26px; line-height: 1.2; margin: 0 0 8px; text-wrap: balance; }
  main.bp h3 { font-size: 16px; color: var(--ink); margin: 0 0 4px; font-weight: 600; }
  main.bp section { margin: 48px 0 0; padding: 0; border: 0; display: block; min-width: 0; }
  .rider { font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--copper); font-weight: 600; margin: 0 0 10px; }
  .lede { font-size: 18px; line-height: 1.55; max-width: 60ch; margin: 0 0 22px; }
  .lede strong { color: var(--ink); font-weight: 600; }
  .intro { max-width: 64ch; margin: 0 0 18px; line-height: 1.55; }
  .citypg { font-size: 14px; color: var(--grey); }
  .citypg a { color: var(--copper); }
  .intro .seen { display: block; font-size: 13.5px; color: var(--grey); margin-top: 2px; }
  .switch { display: inline-flex; border: 1px solid var(--grey); margin: 0 0 18px; flex-wrap: wrap; }
  .switch button { font: inherit; font-size: 15px; padding: 9px 16px; background: transparent; color: var(--body); border: 0; cursor: pointer; }
  .switch button + button { border-left: 1px solid var(--grey); }
  .switch button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
  .switch button:focus-visible, .btn:focus-visible { outline: 3px solid var(--fix); outline-offset: 2px; }
  .sides { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 820px) { .sides { grid-template-columns: minmax(0, 1fr); } }
  .side { background: var(--card); border: 1px solid var(--faint); border-top: 4px solid var(--c); padding: 16px 18px; }
  .side.g0 { --c: var(--g0); } .side.g1 { --c: var(--g1); }
  .sides.one { grid-template-columns: minmax(0, 1fr); max-width: 760px; }
  .sides.one .side { --c: var(--can); }
  .sq { width: 10px; height: 10px; display: inline-block; background: var(--ink); }
  .side.first { order: -1; }
  .side.dim { opacity: .55; }
  .side h2 { font-size: 22px !important; }
  .side .who { font-size: 14px; color: var(--grey); margin: 0 0 12px; }
  .dest { padding: 12px 0; border-top: 1px solid var(--faint); display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 14px; }
  .dest .gain { font-family: var(--font-serif); font-size: 26px; line-height: 1; color: var(--can); font-variant-numeric: tabular-nums; }
  .dest .gain small { display: block; font-family: var(--font-sans); font-size: 12px; color: var(--grey); margin-top: 4px; }
  .dest .gain.words { font-size: 15px; font-family: var(--font-sans); color: var(--grey); }
  .dest p { margin: 0; font-size: 15px; line-height: 1.45; }
  .dest p strong { color: var(--ink); }
  .dest a { color: inherit; }
  .side .also { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--faint); font-size: 15px; line-height: 1.45; }
  .mapwrap { background: var(--card); border: 1px solid var(--faint); margin-top: 24px; }
  canvas { display: block; width: 100%; aspect-ratio: 4 / 3; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; padding: 10px 12px; border-top: 1px solid var(--faint); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .ln { width: 18px; height: 4px; display: inline-block; }
  table.x { border-collapse: collapse; font-size: 15px; width: 100%; max-width: 760px; }
  table.x th, table.x td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--faint); vertical-align: top; }
  table.x th { font-weight: 600; color: var(--ink); font-size: 13px; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 12px; max-width: 760px; margin: 0 0 20px; }
  .fact { background: var(--card); border: 1px solid var(--faint); padding: 12px 14px; }
  .fact b { display: block; font-family: var(--font-serif); font-size: 28px; color: var(--ink); font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .fact span { font-size: 14px; line-height: 1.4; }
  .asks { max-width: 70ch; padding-left: 1.2em; line-height: 1.55; }
  .asks li { margin: 0 0 10px; }
  .asks strong { color: var(--ink); }
  .callout { margin-top: 18px; padding: 14px 18px; background: var(--card); border-left: 4px solid var(--plan); max-width: 70ch; line-height: 1.55; }
  .callout a, .intro a, .asks a { color: var(--copper); }
  .fixlist { list-style: none; padding: 0; margin: 28px 0 0; max-width: 760px; display: grid; gap: 12px; }
  .streetcard { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 18px; align-items: start; padding: 18px 20px;
                background: var(--card); border: 1px solid var(--faint); color: inherit; text-decoration: none; }
  .streetcard:hover { border-color: var(--grey); }
  .streetcard:hover .go { text-decoration: underline; }
  .streetcard:focus-visible { outline: 3px solid var(--copper); outline-offset: 2px; }
  .streetcard .gain { font-family: var(--font-serif); font-size: 34px; line-height: 1; color: var(--can); font-variant-numeric: tabular-nums; }
  .streetcard .gain small { display: block; font-family: var(--font-sans); font-size: 12px; color: var(--grey); margin-top: 5px; }
  .streetcard .meta { margin: 0 0 4px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--grey); }
  .streetcard .planned { color: var(--plan); }
  .streetcard h2 { max-width: none; font-family: var(--font-serif); font-size: 22px; line-height: 1.25; margin: 0 0 6px; color: var(--ink); font-weight: 600; }
  .streetcard p { margin: 0; line-height: 1.5; color: var(--body); }
  .streetcard .go { display: inline-block; margin-top: 10px; font-size: 14px; color: var(--copper); font-weight: 600; }
  @media (max-width: 560px) { .streetcard { grid-template-columns: 1fr; gap: 8px; padding: 16px; } .streetcard .gain small { display: inline; margin-left: 6px; } }
  .act-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 16px; }
  .act-item { background: var(--card); border: 1px solid var(--faint); padding: 16px 18px; }
  .act-item p { font-size: 15px; line-height: 1.5; margin: 0 0 10px; }
  .act-item a { color: var(--copper); }
  .ask-req { background: var(--bg); border: 1px solid var(--faint); padding: 12px 14px; font-size: 14px; line-height: 1.5; margin: 0 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .btn { font: inherit; font-size: 15px; font-weight: 500; padding: 9px 16px; border: 1px solid var(--copper); background: var(--copper); color: var(--accent-ink); cursor: pointer; text-decoration: none; display: inline-block; }
  .muted { color: var(--grey); font-size: 13px; }
  .how { margin-top: 48px; font-size: 14px; color: var(--grey); max-width: 70ch; line-height: 1.55; }
  .how h2 { font-size: 18px !important; }
  .how p { margin: 0 0 8px; }
  .how a { color: inherit; }
  footer.bi-foot { font-size: 13px; color: var(--text-3); margin-top: 32px; line-height: 1.5; }
  footer.bi-foot a { color: inherit; }
</style>
</head>
<body>
<main role="main" class="bp">
/*HEADER*/
/*BODY*/
/*FOOTER*/
</main>
<script>
const MAP = /*MAP*/;

// "I live north / south of the street" (across pages): that side's card goes first and the other dims; remembered in the address
const sides = Object.fromEntries([...document.querySelectorAll(".side[data-group]")].map(el => [el.dataset.group, el]));
const btns = [...document.querySelectorAll(".switch button")];
function pick(s) {
  for (const b of btns) b.setAttribute("aria-pressed", String(b.dataset.side === s));
  for (const [k, el] of Object.entries(sides)) { el.classList.toggle("first", k === s); el.classList.toggle("dim", !!s && k !== s); }
  document.querySelectorAll("[data-for]").forEach(el => { el.hidden = !!s && el.dataset.for !== s; });
}
for (const b of btns) b.addEventListener("click", () => {
  const s = b.getAttribute("aria-pressed") === "true" ? "" : b.dataset.side;
  history.replaceState(null, "", s ? "#" + s : location.pathname); pick(s);
});
pick(sides[location.hash.slice(1)] ? location.hash.slice(1) : "");

// the map: streets, Peninsula, the five crossings, and where the people the crossings would connect live
const cv = document.getElementById("map");
function draw() {
  if (!MAP) return;                       // the list of fix pages has no map
  const css = getComputedStyle(document.documentElement), col = v => css.getPropertyValue(v).trim();
  const W = cv.clientWidth, H = cv.clientHeight, dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const [[y0, x0], [y1, x1]] = MAP.box, k = Math.cos(MAP.center[0] * Math.PI / 180);
  const s = Math.min(W / ((x1 - x0) * k), H / (y1 - y0));
  const ox = (W - (x1 - x0) * k * s) / 2, oy = (H - (y1 - y0) * s) / 2;
  const X = x => ox + (x - x0) * k * s, Y = y => H - oy - (y - y0) * s;
  const style = [[col("--busy"), 1.6], [col("--quiet"), 1], [col("--copper"), 5], [col("--fix"), 5]];
  for (const pass of [1, 0, 2, 3]) {
    const [c, w] = style[pass]; g.strokeStyle = c; g.lineWidth = w; g.lineCap = "round"; g.lineJoin = "round";
    g.beginPath();
    for (const st of MAP.streets) {
      if (st[0] !== pass) continue;
      for (let i = 1; i < st.length; i += 2) (i === 1 ? g.moveTo : g.lineTo).call(g, X(st[i + 1]), Y(st[i]));
    }
    g.stroke();
  }
  const r = Math.max(1.5, s / 2200);
  for (const [y, x, gi, n] of MAP.dots) {
    g.fillStyle = MAP.layout === "across" ? col("--g" + gi) : col("--can"); g.globalAlpha = .7;
    g.beginPath(); g.arc(X(x), Y(y), Math.max(1.5, Math.sqrt(n) * r * .9), 0, 7); g.fill();
  }
  g.globalAlpha = 1;
  for (const [y, x] of MAP.crossings) {
    g.fillStyle = col("--card"); g.strokeStyle = col("--ink"); g.lineWidth = 2.5;
    g.beginPath(); g.arc(X(x), Y(y), 7, 0, 7); g.fill(); g.stroke();
  }
  g.font = "600 12px " + (css.getPropertyValue("--font-sans") || "sans-serif"); g.textBaseline = "middle";
  for (const [y, x, label] of MAP.places || []) {
    g.fillStyle = col("--ink"); g.fillRect(X(x) - 5, Y(y) - 5, 10, 10);
    g.lineWidth = 3; g.strokeStyle = col("--card"); g.strokeText(label, X(x) + 9, Y(y)); g.fillText(label, X(x) + 9, Y(y));
  }
}
draw();
addEventListener("resize", draw);
new MutationObserver(draw).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});

// share, and copy a request
const shareBtn = document.getElementById("share");
shareBtn && shareBtn.addEventListener("click", async () => {
  if (navigator.share && matchMedia("(pointer: coarse)").matches) { try { await navigator.share({title: document.title, url: location.href}); return; } catch (err) { if (err.name === "AbortError") return; } }
  try { await navigator.clipboard.writeText(location.href); document.getElementById("copied").textContent = "Link copied"; } catch (err) { prompt("Copy this link:", location.href); }
});
document.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => {
  const t = document.getElementById(b.dataset.copy).textContent, out = b.nextElementSibling;
  try { await navigator.clipboard.writeText(t); out.textContent = "Copied"; } catch (err) { prompt("Copy this request:", t); }
}));
</script>
</body>
</html>
