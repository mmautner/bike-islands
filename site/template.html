/*HEAD*/
<style>
  /* page colors map onto maxmautner.com's tokens (site.css), so the dark-mode toggle works */
  :root { --ink: var(--text); --body: var(--text-2); --grey: var(--text-3); --light: var(--surface-sunken); --copper: var(--accent); --card: var(--surface); }
  html, body { overflow-x: hidden; }
  main.bi [hidden] { display: none !important; }   /* .legend's display:flex would otherwise beat the hidden attribute */
  main.bi { max-width: 1100px; margin: 0 auto; padding: 0 20px 40px; font-family: var(--font-sans); color: var(--body); }
  main.bi > header { margin-bottom: 18px; }
  main.bi h1 { font-family:'Newsreader', Georgia, serif; font-weight:600; color:var(--ink); font-size: clamp(26px, 4vw, 38px); line-height:1.15; margin:0 0 8px; }
  .sub { font-size:16px; margin:0 0 18px; max-width: 60ch; }
  /* who's riding: a two-way switch, with one line about the chosen map under it */
  .riders { margin: 0 0 16px; }
  .seg { display:flex; max-width: 440px; border:1px solid var(--light); }
  .seg button { flex:1; font:inherit; font-size:15px; line-height:1.25; padding:8px 12px; border:none; background:var(--card); color:var(--body); cursor:pointer; }
  .seg button + button { border-left:1px solid var(--light); }
  .seg button[aria-pressed="true"] { background:var(--copper); color:var(--accent-ink); font-weight:600; }
  .seg button:focus-visible { outline: 3px solid var(--copper); outline-offset: 2px; }
  .ridernote { font-size:14px; margin:6px 0 0; max-width: 70ch; }
  .askquiz { font:inherit; font-size:14px; background:none; border:none; color:var(--copper); text-decoration:underline; cursor:pointer; padding:0; }
  /* site.css resets every margin to 0; a modal dialog needs margin:auto to center */
  dialog#quiz { margin:auto; overflow:auto; border:none; padding:0; width:min(640px, 94vw); max-height: 94vh; background:var(--bg); color:var(--body); box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  dialog#quiz::backdrop { background: rgba(28,28,28,.55); }
  .qwrap { padding: 18px 20px 20px; }
  .qtop { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--grey); margin-bottom:10px; }
  .qtop button { font:inherit; font-size:20px; line-height:1; background:none; border:none; cursor:pointer; color:var(--grey); padding:0 2px; }
  .qprog { height:4px; background:var(--light); margin-bottom:14px; }
  .qprog i { display:block; height:100%; background:var(--copper); transition: width .2s; }
  .qstem { font-size:13px; color:var(--grey); margin:0 0 6px; }
  .qtext { font-family:'Newsreader', Georgia, serif; font-size:22px; line-height:1.25; color:var(--ink); margin:0 0 12px; }
  .qwrap img { display:block; width:100%; aspect-ratio: 1200 / 499; object-fit: cover; background: var(--light); }
  .qwrap figcaption { font-size:12px; color:var(--grey); margin:4px 0 12px; }
  .answers { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
  @media (max-width: 480px) { .answers { grid-template-columns: 1fr; } }
  .answers button { font:inherit; font-size:15px; padding:12px; border:1px solid var(--ink); background:var(--card); color:var(--ink); cursor:pointer; }
  .answers button:hover { background:var(--ink); color:var(--bg); }
  .answers button:focus-visible, .go:focus-visible { outline: 3px solid var(--copper); outline-offset: 2px; }
  .answers button:focus:not(:focus-visible) { outline: none; }
  .answers button.on { background:var(--ink); color:var(--bg); }
  .qnav { display:flex; justify-content:space-between; margin-top:12px; font-size:14px; }
  .qnav button { font:inherit; font-size:14px; background:none; border:none; color:var(--grey); cursor:pointer; padding:0; text-decoration:underline; }
  .qresult p { font-size:16px; line-height:1.5; margin: 0 0 10px; }
  .qresult strong { color:var(--copper); }
  .go { font:inherit; font-size:16px; padding:10px 18px; border:none; background:var(--copper); color:var(--accent-ink); cursor:pointer; margin-top:6px; }
  .wrap { display:grid; grid-template-columns: minmax(0, 1fr) 320px; gap:20px; }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
  #mapbox { position:relative; border:1px solid var(--light); background:var(--bg); height: min(72vh, 680px); touch-action:none; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #bimap:focus { outline:none; }
  #bimap:focus-visible { outline: 3px solid var(--copper); outline-offset: -3px; }
  .zoom { position:absolute; right:10px; top:10px; display:flex; flex-direction:column; }
  .zoom button { font:inherit; width:32px; height:32px; border:1px solid var(--grey); background:var(--bg); color:var(--ink); cursor:pointer; font-size:18px; }
  .zoom button + button { border-top:none; }
  .clearsel { position:absolute; left:10px; top:10px; font:inherit; font-size:14px; padding:5px 10px; border:1px solid var(--grey); background:var(--bg); color:var(--ink); cursor:pointer; }
  .clearsel:hover { border-color:var(--ink); }
  .hint { position:absolute; left:10px; bottom:10px; font-size:13px; background:var(--bg); color:var(--body); padding:4px 8px; opacity:.92; }
  .tip { position:absolute; z-index:2; pointer-events:none; max-width:240px; font-size:13px; line-height:1.4; padding:7px 10px; background:var(--bg); color:var(--body); border:1px solid var(--light); box-shadow:0 4px 14px rgba(0,0,0,.15); }
  .tip strong { color:var(--ink); font-size:14px; }
  .hint:has(.chip) { right:10px; padding:0; opacity:1; background:none; }
  .hint .chip { font:inherit; font-size:14px; text-align:left; width:100%; padding:9px 12px; border:1px solid var(--copper); background:var(--bg); color:var(--ink); cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.15); }
  .hint .chip strong { color:var(--copper); }
  .hint .chip u { color:var(--copper); white-space:nowrap; }
  aside { font-size:15px; line-height:1.45; }
  aside h2 { font-family:'Newsreader', Georgia, serif; font-weight:600; color:var(--ink); font-size:22px; margin:0 0 6px; }
  .big { font-family:'Newsreader', Georgia, serif; font-size:44px; color:var(--copper); line-height:1; }
  .stat { margin: 12px 0; }
  .stat .lbl { font-size:14px; margin-top:4px; }
  .gapbox { margin:12px 0 8px; padding:10px 12px; border-left:3px solid #b4442c; background:var(--card); }
  .gapbox h3 { font-size:15px; font-weight:600; color:var(--ink); margin:0 0 2px; font-family:var(--font-sans); }
  .gapbox p { margin:0 0 6px; font-size:13px; }
  ul.gaps { margin:0; padding-left:18px; font-size:14px; }
  ul.gaps li { margin:3px 0 3px -6px; padding:2px 6px; border-radius:6px; }
  ul.gaps li.hot, ul.gaps li.focus { background:var(--bg); }
  ul.gaps li.focus { box-shadow: inset 3px 0 0 #b4442c; }
  .gapbox p.combo { margin:8px 0 0; font-size:14px; color:var(--ink); }
  .gapbox h3 + p.combo { margin:4px 0 8px; font-size:14.5px; }
  ul.gaps li.key::marker { content:"\2605  "; color:#b4442c; }
  a.gaplink { color:var(--ink); text-decoration: underline dotted #b4442c; text-underline-offset:3px; }
  a.gaplink:hover { text-decoration-style: solid; }
  .answer { font-size:16px; color:var(--ink); margin:10px 0 6px; }
  .cutline { font-size:14px; margin:10px 0 4px; }
  .sthead { display:flex; justify-content:space-between; align-items:baseline; font-size:15px; }
  .sthead strong { color:var(--ink); font-weight:600; }
  .stpct { font-family:'Newsreader', Georgia, serif; font-size:24px; color:var(--copper); line-height:1; }
  details.why { font-size:13px; color:var(--grey); margin-top:4px; }
  details.why summary { cursor:pointer; color:var(--copper); width:max-content; }
  details.why[open] summary { margin-bottom:2px; }
  .bar { height:8px; background:var(--light); margin-top:4px; }
  .bar i { display:block; height:100%; background:var(--copper); }
  ol.br { padding-left: 20px; margin: 6px 0; }
  ol.br li { margin: 2px 0 2px -6px; padding: 4px 6px; border-radius: 8px; }
  ol.br li.hot { background: var(--card); }
  ol.br .joins { display:block; font-size:13px; color:var(--grey); }
  ol.br .joins::before { content:""; display:inline-block; width:14px; height:0; border-top:3px solid #5f87b5; vertical-align:middle; margin-right:6px; }
  /* after a click: three answers (places, school, Caltrain), the one fix, then everything else folded away */
  dl.sum { margin:12px 0 4px; }
  dl.sum .row { display:grid; grid-template-columns: 62px 1fr; gap:8px; padding:8px 0; border-top:1px solid var(--light); }
  dl.sum dt { font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--grey); padding-top:3px; }
  dl.sum dd { margin:0; font-size:14.5px; color:var(--ink); }
  dl.sum dd a { color:inherit; }
  dl.sum .no dd { color:var(--body); }
  dl.sum dd .muted { display:block; }
  aside h3.leadh { font-family:'Newsreader', Georgia, serif; font-weight:600; color:var(--ink); font-size:19px; margin:16px 0 4px; }
  ol.br.lead { margin-top:2px; }
  details.more { margin:16px 0 4px; border-top:1px solid var(--light); padding-top:10px; }
  details.more > summary { cursor:pointer; color:var(--copper); font-size:14px; }
  details.more[open] > summary { margin-bottom:4px; }
  .more h3 { font-size:15px; font-weight:600; color:var(--ink); margin:14px 0 2px; font-family:var(--font-sans); }
  .more ul { margin:0; padding-left:18px; font-size:14px; }
  .more li { margin:2px 0; }
  .more ul a { color:inherit; }
  .more ul.out li::marker { color:var(--copper); }
  ul.stlist { list-style:none; margin:4px 0 0; padding:0; font-size:14px; }
  ul.stlist li { display:grid; grid-template-columns: 1fr 38px 90px; gap:8px; align-items:center; padding:2px 0; }
  ul.stlist b { color:var(--ink); text-align:right; }
  ul.stlist .bar { margin:0; }
  .fixline { margin:10px 0 0; padding:10px 12px; background:var(--card); border-left:3px solid var(--copper); font-size:14px; color:var(--ink); }
  .need { display:block; font-size:13.5px; color:var(--ink); margin-top:2px; }
  .need b { font-weight:600; }
  details.fixwhy { font-size:13px; color:var(--grey); margin-top:2px; }
  details.fixwhy summary { cursor:pointer; color:var(--copper); width:max-content; }
  details.fixwhy p { margin:3px 0; font-size:13px; }
  a.fixlink { color:var(--ink); text-decoration: underline dotted var(--copper); text-underline-offset: 3px; }
  a.fixlink:hover { text-decoration-style: solid; }
  a.fixlink:focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }
  .muted { color:var(--grey); font-size:13px; }
  button.share { font:inherit; font-size:14px; padding:6px 12px; border:1px solid var(--copper); color:var(--copper); background:transparent; cursor:pointer; margin-top:8px; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:13px; margin:10px 0 0; }
  .find { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 10px; }
  .combo { position:relative; flex: 1 1 260px; max-width: 420px; }
  #street { width:100%; font:inherit; font-size:15px; padding:8px 10px; border:1px solid var(--light); background:var(--card); color:var(--ink); }
  #street:focus { outline: 2px solid var(--copper); outline-offset: 0; }
  #streetlist { position:absolute; left:0; right:0; top:100%; z-index:5; list-style:none; margin:2px 0 0; padding:4px 0; background:var(--bg); border:1px solid var(--light); box-shadow:0 6px 20px rgba(0,0,0,.15); max-height:300px; overflow:auto; }
  #streetlist li { padding:6px 10px; cursor:pointer; font-size:14px; color:var(--ink); }
  #streetlist li span { color:var(--grey); margin-left:6px; font-size:13px; }
  #streetlist li[aria-selected="true"], #streetlist li:hover { background:var(--card); }
  #locate { font:inherit; font-size:14px; padding:8px 12px; border:1px solid var(--ink); background:transparent; color:var(--ink); cursor:pointer; }
  #findmsg { font-size:13px; }
  /* "What you can do" sits under the map and the panel, full width, so the panel stays about as tall as the map */
  .act { margin: 28px 0 0; padding: 0; }      /* site.css pads <section>; line up with the map */
  .act h2 { font-family:'Newsreader', Georgia, serif; font-weight:600; color:var(--ink); font-size:22px; margin:0 0 10px; }
  ol.br li.focus { background: var(--card); box-shadow: inset 3px 0 0 var(--copper); }
  a.sharefix { display:inline-block; font-size: 13px; color: var(--copper); margin-top: 2px; }
  input.linkbox { font:inherit; font-size:13px; width:100%; max-width:320px; margin-top:4px; padding:4px 6px; border:1px solid var(--light); background:var(--bg); color:var(--ink); }
  .act-item { background: var(--card); border-radius: 14px; padding: 14px 16px; margin: 0; }
  .act-item h3 { font-size: 16px; font-weight: 600; color: var(--ink); margin: 0 0 4px; font-family: var(--font-sans); }
  .act-item p { margin: 0 0 10px; font-size: 14.5px; }
  .act-item p:last-child { margin-bottom: 0; }
  .act-item a { color: var(--copper); }
  .btn { display:inline-block; font:inherit; font-size:15px; padding:9px 16px; border-radius:9px; border:1px solid var(--light); background:var(--bg); color:var(--ink); cursor:pointer; text-decoration:none; }
  .act-item .btn-primary { background: var(--copper); border-color: var(--copper); color: var(--accent-ink); font-weight: 500; }
  .act-item { max-width: 760px; }
  p.act-btns { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  details.ask { margin-top:12px; border-top:1px solid var(--light); padding-top:10px; }
  details.ask > summary { cursor:pointer; color:var(--copper); font-size:14.5px; }
  details.ask[open] > summary { margin-bottom:8px; }
  .ask-req { background: var(--bg); border: 1px solid var(--light); border-radius: 10px; padding: 10px 12px; font-size: 14.5px; line-height: 1.5; margin: 0 0 10px; max-width: 75ch; }
  .act-item p.ask-note { font-size: 13px; color: var(--grey); max-width: 75ch; }
  .mapnote { font-size:15px; line-height:1.45; color:var(--ink); margin:10px 0 0; }
  .mapnote .muted { font-size:14px; }
  .legend .ramp { display:inline-flex; vertical-align:middle; margin:0 4px; }
  .legend .ramp b { display:block; width:7px; height:6px; background:var(--copper); }
  .legend { column-gap:14px; row-gap:4px; }
  .legend b.schdot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--ink); vertical-align:middle; margin-right:6px; }
  .legend i { display:inline-block; width:22px; height:0; border-top:3px solid; vertical-align:middle; margin-right:6px; }
  footer.bi-foot { font-size:13px; color:var(--grey); margin-top:24px; max-width: 80ch; line-height:1.5; }
  footer.bi-foot a { color:inherit; }
</style>
</head>
<body>
<main role="main" class="bi">
/*HEADER*/
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <div class="riders">
    <div class="seg" role="group" aria-label="Who's riding?">
      <button data-tier="strict" aria-pressed="true">Kids and cautious riders</button>
      <button data-tier="standard" aria-pressed="false">Experienced riders</button>
    </div>
    <p class="ridernote"><span id="ridernote"></span> <button class="askquiz" id="openquiz">Not sure? 7 quick questions</button></p>
  </div>
  <dialog id="quiz" aria-label="Which rider are you?"><div class="qwrap" id="qbody" tabindex="-1" style="outline:none"></div></dialog>
  <div class="wrap">
    <div>
      <div class="find">
        <div class="combo">
          <input id="street" type="text" placeholder="Find your street" autocomplete="off" spellcheck="false"
                 role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="streetlist" aria-label="Find your street">
          <ul id="streetlist" role="listbox" hidden></ul>
        </div>
        <button id="locate" type="button">Use my location</button>
        <span id="findmsg" class="muted" aria-live="polite"></span>
      </div>
      <div id="mapbox">
        <canvas id="bimap" tabindex="0" aria-label="Map of San Mateo and Burlingame streets. Click a street to see its bike island. With the keyboard: arrow keys move the map, plus and minus zoom, 0 shows the whole map, Enter picks the island under the crosshair, Escape clears it."></canvas>
        <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button><button id="zreset" aria-label="Show the whole map" title="Show the whole map">&#10530;</button></div>
        <button id="clear" class="clearsel" type="button" hidden aria-label="Clear the selected island">&times; Clear</button>
        <div class="hint" id="hint"></div>
        <div class="tip" id="tip" hidden></div>
      </div>
      <div class="mapnote" id="mapnote" aria-live="polite"></div>
      <div class="legend">
        <span id="lg-island"><i style="border-color:var(--copper)"></i>Your island</span>
        <span id="lg-other"><i style="border-color:var(--grey)"></i>Other low-stress streets</span>
        <span id="lg-gap" hidden><i style="border-color:#b4442c"></i>In the way</span>
        <span id="lg-join" hidden><i style="border-color:#5f87b5"></i>Islands the fix would join to yours</span>
        <span><i style="border-color:var(--ink); border-top-width:2px"></i>Stressful streets</span>
        <span><b class="schdot"></b>Public elementary school</span>
        <span id="lg-fix" hidden>&#9312; Fix, numbered as in the panel</span>
      </div>
    </div>
    <aside id="panel"></aside>
  </div>
  <section class="act" id="actions" hidden></section>
/*FOOTER*/
</main>
<script>
// Google Analytics events, prefixed islands_ to filter them from the blog's events in the shared property.
// Never sends click coordinates or island ids: only the standard and a rough island size.
function track(name, params) { if (typeof gtag === "function") gtag("event", "islands_" + name, params || {}); }
// Only the default standard ships inside the page; "experienced riders" loads on first use (STD_URL).
const TIERS = ["strict", "standard"];
const DATA = /*DATA*/;
const STD_URL = /*STDURL*/;
const TILE_BASE = /*TILEBASE*/, TILE_V = /*TILEV*/;   // detail tiles: TILE_BASE + "<standard>/<tile>.json"
const STREETS = /*STREETS*/;
const CIVIC = /*CIVIC*/;
const SHARE = /*SHARE*/;       // share-page paths for islands and fixes, per standard
const ftmi = m => { const ft = m * 3.28084; return ft < 1000 ? `${(Math.round(ft / 50) * 50).toLocaleString("en-US")} ft` : `${(m / 1609.34).toFixed(1)} mi`; };
const shareURL = () => {
  const p = sel && SHARE.islands[tier][String(sel)];
  return p ? location.origin + p : location.href;
};
let focusFix = null;   // the chosen fix (from the list, the map or a share link), marked on the map
let hotFix = null;     // the fix under the mouse, on the map or in the list       // city and council-district outlines, council contacts, city links   // [name, city, [s, w, n, e]] for every named street in the frame
const FETCHED = /*FETCHED*/;
let COPPER, INK, LOWC, FAINT, PAPER;
function palette() {
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  COPPER = v("--accent") || "#b5763c"; INK = v("--text") || "#1c1c1c"; LOWC = v("--text-3") || "#8a847b";
  FAINT = v("--surface-sunken") || "#dedad3"; PAPER = v("--bg") || "#faf8f4";
}
palette();
const fmt = n => Math.round(n).toLocaleString("en-US");
const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "n/a";
{ const f = document.getElementById("fetched"); if (f) f.textContent = FETCHED; }

// decode delta-encoded lines once per tier
function decodePts(p, oy, ox) {
  const out = []; let a = oy || 0, b = ox || 0;
  for (let k = 0; k < p.length; k += 2) { a += p[k]; b += p[k + 1]; out.push([a / 1e5, b / 1e5]); }
  return out;
}
const tileKey = (la, lo, T) => `${Math.floor(la / T.tile_size[0])}_${Math.floor(lo / T.tile_size[1])}`;
function decodeTier(t) {
  // overview: [lts, island or 0, first point relative to the frame corner, deltas...]
  t.lines = t.packed.map(r => {
    const pts = decodePts(r.slice(2), t.origin[0], t.origin[1]);
    const L = {l: r[0], pts};
    if (r[1]) L.i = r[1];
    const m = pts[Math.floor(pts.length / 2)];
    L.t = tileKey(m[0], m[1], t);       // the tile holding this street's full detail
    if (r[1]) {                         // extent, so pick() can skip streets far from the pointer
      const bb = [90, 180, -90, -180];
      for (const p of pts) { bb[0] = Math.min(bb[0], p[0]); bb[1] = Math.min(bb[1], p[1]); bb[2] = Math.max(bb[2], p[0]); bb[3] = Math.max(bb[3], p[1]); }
      L.bb = bb;
    }
    return L;
  });
  delete t.packed;
  t.tileSet = new Set(t.tiles);
  t.detail = new Map();                 // tile key -> full lines with routing nodes
  t.loading = new Map();
  for (const B of t.bridges) B.pts = decodePts(B.p);
}
decodeTier(DATA.strict);
// --- detail tiles: full geometry and routing nodes, fetched only where they're needed ---
function loadTiles(t, which, keys) {
  return Promise.all(keys.filter(k => t.tileSet.has(k) && !t.detail.has(k)).map(k => {
    if (!t.loading.has(k)) t.loading.set(k, fetch(`${TILE_BASE}${which}/${k}.json?v=${TILE_V}`)
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(d => {
        for (const L of d.lines) {
          L.pts = decodePts(L.p); delete L.p;
          if (L.n) { let c = 0; L.nodes = L.n.map(x => (c += x)); delete L.n; }   // stressful streets have no routing nodes
        }
        t.detail.set(k, d.lines); t.loading.delete(k); t._adjFor = null; t._stn = null;
      })
      .catch(err => { t.loading.delete(k); throw err; }));
    return t.loading.get(k);
  }));
}
function tilesIn(t, s, w, n, e) {

const MINOR_FIX = 0.02;

    const prev = seen.get(key);

      (T.bridges[prev.bid].id !== focusFix && !!fixCrossing(B) > !!fixCrossing(T.bridges[prev.bid])) ||
      (T.bridges[prev.bid].id !== focusFix && B.kind === T.bridges[prev.bid].kind && B.kind === "w" && B.len < T.bridges[prev.bid].len);

// Share a link: the phone's share sheet where there is one, else copy it. If copying isn't allowed,
// show the link, selected, so it can be copied by hand. Says what happened in `msg`.
const CAN_SHARE = COARSE && typeof navigator.share === "function";
async function shareOrCopy(url, title, msg) {
  if (CAN_SHARE) {
    try { await navigator.share({title, url}); msg.textContent = ""; return "shared"; }
    catch (err) { if (err.name === "AbortError") return "cancelled"; }     // otherwise fall back to copying
  }
  try { await navigator.clipboard.writeText(url); msg.textContent = "Copied"; return "copied"; }
  catch (err) {
    msg.innerHTML = `Copy this link: <input class="linkbox" readonly aria-label="Link to copy">`;
    const box = msg.querySelector("input"); box.value = url; box.focus(); box.select();
    return "shown";
  }
}

    (needPlain(f.B) ? `<br>${needPlain(f.B)}` : "") +
    `<br><span class="muted">${f.B.id === focusFix ? "Click to let go" : NARROW.matches ? "Click to choose it" : "Click to find it in the list"}</span>`;

  for (const [n, d] of near.seeds) if (heat.has(n)) best = Math.min(best, heat.get(n) + d);

function endPointer(e, cancelled) {

function zoomAt(f, cx, cy) {

cv.addEventListener("focus", () => draw());
cv.addEventListener("blur", () => draw());
let riderSource = "card";  // set to "quiz" while the quiz result switches the standard

// --- quiz ---
// Part A: verbatim items from Dill & McNeil's national survey (TRR 2587, 2016), used to give
// the reader's national cyclist type. Part B: this map's own items, each testing one rule

const STEM = "For each of the following places you could ride a bike, please indicate whether you would be comfortable or uncomfortable biking there.";
const MAJOR = "A major urban or suburban street with 4 lanes, on-street parking, traffic speeds of 30–35 mph and ";
const QS = [
  {id: "a1", part: "A", map: true, text: "A quiet residential street with traffic traveling at speeds of 20–25 mph",
   img: "img/q1.jpg", cap: "For example, E Santa Inez Ave, San Mateo. Google Street View, June 2026"},
  {id: "a2", part: "A", text: MAJOR + "no bike lane",
   img: "img/a2.jpg", cap: "For example, N El Camino Real near Tilton Ave, San Mateo (posted 35 mph). Google Street View, June 2026"},
  {id: "a3", part: "A", text: MAJOR + "a striped bike lane",
   img: "img/a3.jpg", cap: "For example, Peninsula Ave near N Humboldt St, San Mateo (posted 35 mph; no on-street parking at this spot). Google Street View, August 2022"},
  {id: "b1", part: "B", map: true, text: "A painted bike lane on a 2-lane street posted 30 mph, with cars passing a few feet away",
   img: "img/q2.jpg", cap: "For example, N San Mateo Dr, San Mateo (posted 30 mph; half of drivers go faster than 27). Google Street View, June 2026"},
  {id: "b2", part: "B", map: true, text: "Sharing the lane with cars on a busier 2-lane street posted 25 mph, with no bike lane",
   img: "img/q3.jpg", cap: "For example, N Delaware St, San Mateo (posted 25 mph; half of drivers go faster than 29). Google Street View, June 2026"},
  {id: "b3", part: "B", map: true, text: "Crossing a street posted 30 mph where there's no stop sign or light for the cars",
   img: "img/q4.jpg", cap: "For example, crossing Peninsula Ave at Lorton Ave, Burlingame (posted 30 mph; half of drivers go faster than 26). Google Street View, June 2026"},
  {id: "b4", part: "B", map: true, text: "Crossing El Camino Real at a traffic light",
   img: "img/q5.jpg", cap: "For example, El Camino Real at Bellevue Ave, San Mateo. Google Street View, June 2026"},
];
const OPTS = ["Very comfortable", "Somewhat comfortable", "Somewhat uncomfortable", "Very uncomfortable"];
const dlg = document.getElementById("quiz"), qb = document.getElementById("qbody");
let step = 0, ans = {};
function qrender() {
  const top = (label) => `<div class="qtop"><span>${label}</span><button aria-label="Close" id="qclose">&times;</button></div>`;
  if (step < QS.length) {
    const q = QS[step];
    qb.innerHTML = top(`Question ${step + 1} of ${QS.length}`) +
      `<div class="qprog"><i style="width:${100 * step / QS.length}%"></i></div>` +
      `<p class="qstem">How comfortable would you feel biking here?</p>` +
      `<p class="qtext">${q.text}</p>` +
      (q.img ? `<figure style="margin:0"><img src="${q.img}" alt=""><figcaption>${q.cap}</figcaption></figure>` : "") +
      `<div class="answers">${OPTS.map((t, i) => `<button data-v="${i + 1}" class="${ans[q.id] === i + 1 ? "on" : ""}">${t}</button>`).join("")}</div>` +
      `<div class="qnav"><span>${step ? '<button id="qback">Back</button>' : ""}</span></div>`;
    qb.querySelectorAll(".answers button").forEach(b => b.onclick = () => { ans[q.id] = Number(b.dataset.v); step++; qrender(); });
    if (step) document.getElementById("qback").onclick = () => { step--; qrender(); };
  } else {
    const adult = QS.filter(q => q.map).every(q => ans[q.id] <= 2);
    const typeName = ans.a2 === 1 ? "strong and fearless" : ans.a3 === 1 ? "enthused and confident" : "interested but concerned";
    if (!quizDone) { quizDone = true; track("quiz_completed", {standard: adult ? "standard" : "strict", cyclist_type: typeName}); }
    const t = adult ? "standard" : "strict";
    let msg = adult
      ? "<p>Your map: <strong>experienced riders</strong>. You'd be comfortable on every kind of street and crossing it counts.</p>"
      : "<p>Your map: <strong>kids and cautious riders</strong>. The other map counts at least one kind of street or crossing you'd be uncomfortable on.</p>";
    if (ans.a1 >= 3) msg += "<p>Even quiet residential streets feel uncomfortable to you, so the map may still show more routes than you'd use.</p>";
    const type = ans.a2 === 1 ? "strong and fearless" : ans.a3 === 1 ? "enthused and confident" : "interested but concerned";
    msg += `<p class="muted">In Dill and McNeil's national survey, your answers to questions 2 and 3 would make you "${type}."</p>`;
    qb.innerHTML = top("Your result") + `<div class="qprog"><i style="width:100%"></i></div><div class="qresult">${msg}</div>` +

let quizDone = false;

const panelEl = document.getElementById("panel");
panelEl.addEventListener("click", e => {

  const fl = e.target.closest(".fixlink");
  if (fl) { e.preventDefault(); selectFix(fl.closest("li").dataset.fix, "list"); }
  const gl = e.target.closest(".gaplink");
  if (gl) { e.preventDefault(); selectGap(Number(gl.closest("li").dataset.gap)); }

const liGap = e => { const li = e.target.closest && e.target.closest("li[data-gap]"); return li ? Number(li.dataset.gap) : null; };

// links that leave maxmautner.com
document.addEventListener("click", e => {
  const a = e.target.closest("a[href]");
  if (!a) return;

    const u = new URL(a.getAttribute("href"), location.href);
    if (u.protocol.startsWith("http") && u.hostname !== location.hostname)

// --- find a street, or use the browser's location; nothing typed or located leaves the page ---
const ABBR = {n: "north", s: "south", e: "east", w: "west", st: "street", ave: "avenue", av: "avenue", dr: "drive",
  rd: "road", blvd: "boulevard", ln: "lane", ct: "court", pl: "place", wy: "way", hwy: "highway", cir: "circle", pkwy: "parkway"};
const toks = q => q.toLowerCase().replace(/[.,]/g, " ").split(/\s+/).filter(Boolean).map(t => ABBR[t] || t);
const STREET_TOKS = STREETS.map(r => toks(r[0]));
function matchStreets(q) {
  const qt = toks(q);
  if (!qt.length) return [];
  const out = [];
  STREETS.forEach((r, i) => {
    const nt = STREET_TOKS[i];
    if (!qt.every(t => nt.some(n => n.startsWith(t)))) return;
    const first = nt.findIndex(n => n.startsWith(qt[0]));      // earlier match ranks higher
    out.push([first + (nt[0].startsWith(qt[0]) ? 0 : 1), r[0].length, i]);

function zoomTo(s, w, n, e, maxScale) {
  const gw = (V[3] - V[1]) * K, gh = V[2] - V[0];
  const bw = Math.max((e - w) * K, 0.002), bh = Math.max(n - s, 0.002);
  scale = Math.max(1, Math.min(maxScale || 8, Math.min(W / (bw * base), H / (bh * base)) * 0.7));
  const cla = (s + n) / 2, clo = (w + e) / 2;
  ox = -((clo - V[1]) * K - gw / 2) * base * scale;
  oy = -(gh / 2 - (cla - V[0])) * base * scale;

const sIn = document.getElementById("street"), sList = document.getElementById("streetlist"), fMsg = document.getElementById("findmsg");
let sHits = [], sIdx = -1;
function showList() {
  sList.innerHTML = sHits.map((r, i) => `<li role="option" id="st${i}" aria-selected="${i === sIdx}">${r[0]}<span>${r[1]}</span></li>`).join("");
  sList.hidden = !sHits.length; sIn.setAttribute("aria-expanded", String(!!sHits.length));

function chooseStreet(r) {

  const [s, w, n, e] = r[2];
  zoomTo(s, w, n, e);
  // light up the island at a point on the street (r[3]). A tight radius, so a busy street doesn't
  // borrow the island of a quiet one beside it.
  const [x, y] = px(r[3][0], r[3][1]);
  const id = pick(x, y, null, 8);
  const tap = COARSE ? "Tap" : "Click";
  fMsg.textContent = !id ? `${r[0]} is a stressful street for ${WHO[tier]}, so it isn't on any island. ${tap} a quiet street near it to see that island.`
    : (e - w) * K + (n - s) > 0.012 ? `Showing the island at the middle of ${r[0]}, ${r[1]}. ${tap} your block if you live elsewhere on it.`
    : `Showing ${r[0]}, ${r[1]}, and its island. ${tap} another street to see its island.`;

sIn.addEventListener("input", () => { sHits = matchStreets(sIn.value); sIdx = sHits.length ? 0 : -1; showList(); });
sIn.addEventListener("keydown", e => {
  if (sList.hidden) return;
  if (e.key === "ArrowDown") { sIdx = (sIdx + 1) % sHits.length; showList(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { sIdx = (sIdx - 1 + sHits.length) % sHits.length; showList(); e.preventDefault(); }
  else if (e.key === "Enter" && sIdx >= 0) { chooseStreet(sHits[sIdx]); e.preventDefault(); }
  else if (e.key === "Escape") { sHits = []; showList(); }
});
sList.addEventListener("mousedown", e => { const li = e.target.closest("li"); if (li) { e.preventDefault(); chooseStreet(sHits[Number(li.id.slice(2))]); } });

document.getElementById("locate").onclick = () => {
  if (!navigator.geolocation) { fMsg.textContent = "This browser can't share its location."; return; }
  fMsg.textContent = "Finding you…";
  navigator.geolocation.getCurrentPosition(pos => {
    const la = pos.coords.latitude, lo = pos.coords.longitude;
    const inArea = la > V[0] - 0.01 && la < V[2] + 0.01 && lo > V[1] - 0.01 && lo < V[3] + 0.01;
    track("location_used", {in_area: inArea, standard: tier});   // coordinates are never sent
    if (!inArea) { fMsg.textContent = "Your location is outside this map, which covers San Mateo and Burlingame."; return; }
    zoomTo(la - 0.002, lo - 0.003, la + 0.002, lo + 0.003, 10);
    const [x, y] = px(la, lo);
    const id = pick(x, y);
    fMsg.textContent = id ? "Your island is lit up. Your location stays in your browser." : "No low-stress street close to you; try clicking one nearby.";
    selectIsland(id, [la, lo], "location");
  }, err => {
    fMsg.textContent = err.code === 1 ? "Location permission was turned off. You can type your street instead." : "Couldn't get your location. You can type your street instead.";
  }, {enableHighAccuracy: true, timeout: 10000, maximumAge: 60000});
};

window.addEventListener("resize", fit);
NARROW.addEventListener("change", hint);
new MutationObserver(() => { palette(); draw(); }).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});
window.addEventListener("popstate", applyHash);     // Back and Forward, and a hash typed into the address bar
fit(); applyHash();
