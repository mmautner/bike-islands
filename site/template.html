/*HEAD*/
<style>
  /* page colors map onto maxmautner.com's tokens (site.css), so the dark-mode toggle works */
  :root { --ink: var(--text); --body: var(--text-2); --grey: var(--text-3); --light: var(--surface-sunken); --copper: var(--accent); --card: var(--surface); }
  html, body { overflow-x: hidden; }
  main.bi { max-width: 1100px; margin: 0 auto; padding: 0 20px 40px; font-family: var(--font-sans); color: var(--body); }
  main.bi > header { margin-bottom: 18px; }
  main.bi h1 { font-family:'Newsreader', Georgia, serif; font-weight:600; color:var(--ink); font-size: clamp(26px, 4vw, 38px); line-height:1.15; margin:0 0 8px; }
  .sub { font-size:16px; margin:0 0 18px; max-width: 60ch; }
  .riders { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; max-width: 900px; margin: 0 0 18px; }
  @media (max-width: 720px) { .riders { grid-template-columns: 1fr; } }
  .riders button.quizcard { border-style: dashed; border-color: var(--copper); background: transparent; }
  .riders button.quizcard strong { color: var(--copper); }
  .riders button.quizcard:hover { background:var(--card); }
  .askquiz { font:inherit; font-size:14px; background:none; border:none; color:var(--copper); text-decoration:underline; cursor:pointer; padding:0; }
  .riders button { font:inherit; text-align:left; padding:10px 14px; border:1px solid var(--light); background:var(--card); color:var(--body); cursor:pointer; line-height:1.35; }
  .riders button strong { display:block; font-size:16px; color:var(--ink); margin-bottom:2px; }
  .riders button span { font-size:13px; }
  .riders button[aria-pressed="true"] { border:2px solid var(--copper); padding:9px 13px; }
  .riders button[aria-pressed="true"] strong::before { content:"\2713  "; color:var(--copper); }
  dialog#quiz { border:none; padding:0; width:min(640px, 94vw); max-height: 94vh; background:var(--bg); color:var(--body); box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  dialog#quiz::backdrop { background: rgba(28,28,28,.55); }
  .qwrap { padding: 18px 20px 20px; }
  .qtop { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--grey); margin-bottom:10px; }
  .qtop button { font:inherit; font-size:20px; line-height:1; background:none; border:none; cursor:pointer; color:var(--grey); padding:0 2px; }
  .qprog { height:4px; background:var(--light); margin-bottom:14px; }
  .qprog i { display:block; height:100%; background:var(--copper); transition: width .2s; }
  .qstem { font-size:13px; color:var(--grey); margin:0 0 6px; }
  .qtext { font-family:'Newsreader', Georgia, serif; font-size:22px; line-height:1.25; color:var(--ink); margin:0 0 12px; }
  .qwrap img { display:block; width:100%; aspect-ratio: 1200 / 499; object-fit: cover; background: var(--light); }
  .qwrap figcaption { font-size:12px; color:var(--grey); margin:4px 0 12px; }
  .answers { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
  @media (max-width: 480px) { .answers { grid-template-columns: 1fr; } }
  .answers button { font:inherit; font-size:15px; padding:12px; border:1px solid var(--ink); background:var(--card); color:var(--ink); cursor:pointer; }
  .answers button:hover { background:var(--ink); color:var(--bg); }
  .answers button:focus-visible, .go:focus-visible { outline: 3px solid var(--copper); outline-offset: 2px; }
  .answers button:focus:not(:focus-visible) { outline: none; }
  .answers button.on { background:var(--ink); color:var(--bg); }
  .qnav { display:flex; justify-content:space-between; margin-top:12px; font-size:14px; }
  .qnav button { font:inherit; font-size:14px; background:none; border:none; color:var(--grey); cursor:pointer; padding:0; text-decoration:underline; }
  .qresult p { font-size:16px; line-height:1.5; margin: 0 0 10px; }
  .qresult strong { color:var(--copper); }
  .go { font:inherit; font-size:16px; padding:10px 18px; border:none; background:var(--copper); color:var(--accent-ink); cursor:pointer; margin-top:6px; }
  .wrap { display:grid; grid-template-columns: minmax(0, 1fr) 320px; gap:20px; }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
  #mapbox { position:relative; border:1px solid var(--light); background:var(--bg); height: min(72vh, 680px); touch-action:none; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  .zoom { position:absolute; right:10px; top:10px; display:flex; flex-direction:column; }
  .zoom button { font:inherit; width:32px; height:32px; border:1px solid var(--grey); background:var(--bg); color:var(--ink); cursor:pointer; font-size:18px; }
  .zoom button + button { border-top:none; }
  .hint { position:absolute; left:10px; bottom:10px; font-size:13px; background:var(--bg); color:var(--body); padding:4px 8px; opacity:.92; }
  aside { font-size:15px; line-height:1.45; }
  aside h2 { font-family:'Newsreader', Georgia, serif; font-weight:600; color:var(--ink); font-size:22px; margin:0 0 6px; }
  .big { font-family:'Newsreader', Georgia, serif; font-size:44px; color:var(--copper); line-height:1; }
  .stat { margin: 12px 0; }
  .stat .lbl { font-size:14px; }
  .bar { height:8px; background:var(--light); margin-top:4px; }
  .bar i { display:block; height:100%; background:var(--copper); }
  ol.br { padding-left: 20px; margin: 6px 0; }
  ol.br li { margin: 6px 0; }
  .muted { color:var(--grey); font-size:13px; }
  button.share { font:inherit; font-size:14px; padding:6px 12px; border:1px solid var(--copper); color:var(--copper); background:transparent; cursor:pointer; margin-top:8px; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:13px; margin:10px 0 0; }
  .mapnote { font-size:15px; line-height:1.45; color:var(--ink); margin:10px 0 0; }
  .mapnote .muted { font-size:14px; }
  .heatlegend b { display:inline-block; width:22px; height:6px; background:var(--copper); vertical-align:middle; margin-right:5px; }
  .legend i { display:inline-block; width:22px; height:0; border-top:3px solid; vertical-align:middle; margin-right:6px; }
  footer.bi-foot { font-size:13px; color:var(--grey); margin-top:24px; max-width: 80ch; line-height:1.5; }
  footer.bi-foot a { color:inherit; }
</style>
</head>
<body>
<main role="main" class="bi">
/*HEADER*/
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <div class="riders seg" role="group" aria-label="Who's riding?">
    <button data-tier="strict" aria-pressed="true"><strong>Kids and cautious riders</strong><span>Paths and quiet streets only. Never on busy streets, never across El Camino.</span></button>
    <button data-tier="standard" aria-pressed="false"><strong>Most adults</strong><span>Also painted bike lanes and busier 2-lane streets. Any traffic light makes a crossing OK.</span></button>
    <button class="quizcard" id="openquiz"><strong>Which map fits you? 7 quick questions</strong><span>With photos of local streets. Your answers pick the map.</span></button>
  </div>
  <dialog id="quiz" aria-label="Which rider are you?"><div class="qwrap" id="qbody" tabindex="-1" style="outline:none"></div></dialog>
  <div class="wrap">
    <div>
      <div id="mapbox">
        <canvas id="map" aria-label="Map of San Mateo and Burlingame streets. Click a street to see its bike island."></canvas>
        <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button></div>
        <div class="hint" id="hint">Click near where you live</div>
      </div>
      <div class="mapnote" id="mapnote" aria-live="polite"></div>
      <div class="legend">
        <span id="lg-island"><i style="border-color:var(--copper)"></i>Your island</span>
        <span id="lg-other"><i style="border-color:var(--grey)"></i>Other low-stress streets</span>
        <span><i style="border-color:var(--ink); border-top-width:2px"></i>Stressful streets</span>
        <span>&#9312; Fix that would connect your island (numbered as in the list)</span>
      </div>
      <div class="legend heatlegend" id="heatlegend" hidden></div>
    </div>
    <aside id="panel"></aside>
  </div>
/*FOOTER*/
</main>
<script>
// Google Analytics events, prefixed islands_ to filter them from the blog's events in the shared property.
// Never sends click coordinates or island ids: only the standard and a rough island size.
function track(name, params) { if (typeof gtag === "function") gtag("event", "islands_" + name, params || {}); }
// Only the default standard ships inside the page; "most adults" loads on first use (STD_URL).
const TIERS = ["strict", "standard"];
const DATA = /*DATA*/;
const STD_URL = /*STDURL*/;
const FETCHED = /*FETCHED*/;
let COPPER, INK, LOWC, FAINT, PAPER;
function palette() {
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  COPPER = v("--accent") || "#b5763c"; INK = v("--text") || "#1c1c1c"; LOWC = v("--text-3") || "#8a847b";
  FAINT = v("--surface-sunken") || "#dedad3"; PAPER = v("--bg") || "#faf8f4";
}
palette();
const fmt = n => Math.round(n).toLocaleString("en-US");
const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "n/a";
{ const f = document.getElementById("fetched"); if (f) f.textContent = FETCHED; }

// decode delta-encoded lines once per tier
function decodeTier(t) {
  for (const L of t.lines) {
    const p = L.p, out = [];
    let a = 0, b = 0;
    for (let k = 0; k < p.length; k += 2) { a += p[k]; b += p[k + 1]; out.push([a / 1e5, b / 1e5]); }
    L.pts = out;
    if (L.n) { let c = 0; L.nodes = L.n.map(d => (c += d)); }
  }
  for (const B of t.bridges) {
    const p = B.p, out = [];
    let a = 0, b = 0;
    for (let k = 0; k < p.length; k += 2) { a += p[k]; b += p[k + 1]; out.push([a / 1e5, b / 1e5]); }
    B.pts = out;
  }
}
decodeTier(DATA.strict);
let loadingStd = null;
function ensureTier(t) {
  if (DATA[t]) return Promise.resolve();
  if (!loadingStd) loadingStd = fetch(STD_URL)
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(d => { decodeTier(d); DATA.standard = d; })
    .catch(err => { loadingStd = null; throw err; });
  return loadingStd;
}
function showLoading() {
  document.getElementById("panel").innerHTML = '<h2>Your island</h2><p class="muted">Loading the map for most adults…</p>';
}

// --- riding times: shortest low-stress route from the clicked spot to every street on the island ---
const MPH = 10, M_PER_MIN = MPH * 1609.34 / 60;      // an easy pace; no hills, no waits at signals
const BANDS = [5, 10, 15, 20];                        // minutes
const ALPHA = [1, 0.78, 0.58, 0.42, 0.28];            // nearer = stronger
const metres = (a, b) => Math.hypot((b[0] - a[0]) * 111320, (b[1] - a[1]) * 111320 * Math.cos(37.55 * Math.PI / 180));
function graph(T) {
  if (T._adj) return T._adj;
  const adj = new Map();
  const add = (a, b, m) => { if (!adj.has(a)) adj.set(a, []); adj.get(a).push([b, m]); };
  for (const L of T.lines) if (L.nodes) for (let k = 1; k < L.pts.length; k++) {
    const m = metres(L.pts[k - 1], L.pts[k]);
    add(L.nodes[k - 1], L.nodes[k], m); add(L.nodes[k], L.nodes[k - 1], m);
  }
  return (T._adj = adj);
}
function dijkstra(adj, seeds) {              // seeds: [[node, metres]]
  const dist = new Map(), heap = [];
  const push = (d, n) => { heap.push([d, n]); let i = heap.length - 1;
    while (i) { const p = (i - 1) >> 1; if (heap[p][0] <= heap[i][0]) break; [heap[p], heap[i]] = [heap[i], heap[p]]; i = p; } };
  const pop = () => { const top = heap[0], last = heap.pop();
    if (heap.length) { heap[0] = last; let i = 0;
      for (;;) { const l = 2 * i + 1, r = l + 1; let m = i;
        if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
        if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } }
    return top; };
  for (const [n, d] of seeds) if (!(dist.get(n) <= d)) { dist.set(n, d); push(d, n); }
  while (heap.length) {
    const [d, u] = pop();
    if (d > dist.get(u)) continue;
    for (const [v, m] of adj.get(u) || []) if (!(dist.get(v) <= d + m)) { dist.set(v, d + m); push(d + m, v); }
  }
  return dist;
}
let clickPt = null;           // [lat, lon] of the last click; kept in memory only, never in the link
let heat = null, heatFrom = "";
function nearestOnIsland(T, id, pt) {
  let best = null;
  for (const L of T.lines) if (L.i === id && L.nodes) for (let k = 1; k < L.pts.length; k++) {
    const a = L.pts[k - 1], b = L.pts[k], ab = metres(a, b);
    const ax = metres(a, [a[0], pt[1]]) * Math.sign(pt[1] - a[1]), ay = metres(a, [pt[0], a[1]]) * Math.sign(pt[0] - a[0]);
    const bx = metres(a, [a[0], b[1]]) * Math.sign(b[1] - a[1]), by = metres(a, [b[0], a[1]]) * Math.sign(b[0] - a[0]);
    const t = ab ? Math.max(0, Math.min(1, (ax * bx + ay * by) / (ab * ab))) : 0;
    const d = Math.hypot(ax - t * bx, ay - t * by);
    if (!best || d < best.d) best = {d, seeds: [[L.nodes[k - 1], t * ab], [L.nodes[k], (1 - t) * ab]]};
  }
  return best;
}
function stationNode(T, id, st) {            // the island's node nearest a station, within 250 m
  const sp = T.stations[st];
  let best = null;
  for (const L of T.lines) if (L.i === id && L.nodes) L.pts.forEach((p, k) => {
    const d = metres(p, sp); if (d < 250 && (!best || d < best.d)) best = {d, n: L.nodes[k]};
  });
  return best;
}
function computeHeat() {
  heat = null; heatFrom = "";
  if (!sel) return;
  const T = DATA[tier], adj = graph(T);
  const near = clickPt && nearestOnIsland(T, sel, clickPt);
  if (near) { heat = dijkstra(adj, near.seeds); heatFrom = "where you clicked"; return; }
  // a shared link carries no click: color from the island's station, if it reaches one
  for (const st of Object.keys(T.stations)) {
    const sn = stationNode(T, sel, st);
    if (sn) { heat = dijkstra(adj, [[sn.n, sn.d]]); heatFrom = `${st} Caltrain`; return; }
  }
}
const band = mins => { let b = 0; while (b < BANDS.length && mins >= BANDS[b]) b++; return b; };

// Before a click, each larger island gets its own muted color so the islands themselves are visible.
// Neighboring islands are kept apart: greedy coloring by distance between island centers.
const ISLAND_HUES = ["#5f87b5", "#6e9f68", "#a27aa8", "#b8913f", "#4f9d97", "#b86f5a", "#8484c4", "#7f9c45"];
const MIN_HOMES_COLORED = 150;
function islandColors(T) {
  if (T._col) return T._col;
  const box = {};                       // bounding box of each island, padded ~300 m
  for (const L of T.lines) if (L.i !== undefined) for (const p of L.pts) {
    const b = box[L.i] || (box[L.i] = [p[0], p[1], p[0], p[1]]);
    b[0] = Math.min(b[0], p[0]); b[1] = Math.min(b[1], p[1]); b[2] = Math.max(b[2], p[0]); b[3] = Math.max(b[3], p[1]);
  }
  const pad = 0.003, touch = (a, b) => a[0] - pad < b[2] && b[0] - pad < a[2] && a[1] - pad < b[3] && b[1] - pad < a[3];
  const ids = Object.keys(box).map(Number)
    .filter(i => ((T.islands[i] || {}).homes || 0) >= MIN_HOMES_COLORED)
    .sort((a, b) => T.islands[b].homes - T.islands[a].homes);
  const col = new Map();
  for (const i of ids) {
    const used = new Set(ids.filter(j => col.has(j) && touch(box[i], box[j])).map(j => col.get(j)));
    let k = 0; while (used.has(k) && k < ISLAND_HUES.length) k++;
    col.set(i, k % ISLAND_HUES.length);
  }
  return (T._col = col);
}

let tier = "strict", sel = null;
const cv = document.getElementById("map"), ctx = cv.getContext("2d");
const box = document.getElementById("mapbox");
const V = DATA.strict.view; // [s, w, n, e]
const K = Math.cos((V[0] + V[2]) / 2 * Math.PI / 180);
let scale = 1, ox = 0, oy = 0, W = 0, H = 0, base = 1;

function fit() {
  const r = box.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const gw = (V[3] - V[1]) * K, gh = V[2] - V[0];
  base = Math.min(W / gw, H / gh);
  draw();
}
function unpx(x, y) {
  const gw = (V[3] - V[1]) * K, gh = V[2] - V[0];
  const lo = ((x - W / 2 - ox) / (base * scale) + gw / 2) / K + V[1];
  const la = gh / 2 - (y - H / 2 - oy) / (base * scale) + V[0];
  return [la, lo];
}
function px(la, lo) {
  const gw = (V[3] - V[1]) * K, gh = V[2] - V[0];
  const x = ((lo - V[1]) * K - gw / 2) * base * scale + W / 2 + ox;
  const y = (gh / 2 - (la - V[0])) * base * scale + H / 2 + oy;
  return [x, y];
}
function stroke(pts, color, width) {
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath();
  pts.forEach((p, k) => { const [x, y] = px(p[0], p[1]); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.stroke();
}
function draw() {
  const T = DATA[tier] || DATA.strict;
  ctx.clearRect(0, 0, W, H);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  const z = Math.max(1, Math.sqrt(scale));
  for (const L of T.lines) if (L.i === undefined) stroke(L.pts, INK, 1.1 * z);
  if (sel) { for (const L of T.lines) if (L.i !== undefined && L.i !== sel) stroke(L.pts, FAINT, 1.1 * z); }
  else {
    const col = islandColors(T);
    for (const L of T.lines) if (L.i !== undefined && !col.has(L.i)) stroke(L.pts, LOWC, 1.1 * z);
    for (const L of T.lines) if (col.has(L.i)) stroke(L.pts, ISLAND_HUES[col.get(L.i)], 1.7 * z);
  }
  if (sel) for (const L of T.lines) if (L.i === sel) {
    if (!heat || !L.nodes) { stroke(L.pts, COPPER, 2.6 * z); continue; }
    for (let k = 1; k < L.pts.length; k++) {
      const da = heat.get(L.nodes[k - 1]), db = heat.get(L.nodes[k]);
      const mins = ((da ?? db ?? 1e9) + (db ?? da ?? 1e9)) / 2 / M_PER_MIN;
      ctx.globalAlpha = ALPHA[band(mins)];
      stroke([L.pts[k - 1], L.pts[k]], COPPER, 2.8 * z);
    }
    ctx.globalAlpha = 1;
  }
  if (heat && clickPt && heatFrom === "where you clicked") {   // mark the start
    const [x, y] = px(clickPt[0], clickPt[1]);
    ctx.fillStyle = COPPER; ctx.strokeStyle = PAPER; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fill(); ctx.stroke();
  }
  // bridges for the selected island
  // stations
  ctx.font = "600 13px 'IBM Plex Sans', sans-serif";
  for (const [name, [la, lo]] of Object.entries(T.stations)) {
    const [x, y] = px(la, lo);
    ctx.fillStyle = INK; ctx.fillRect(x - 6, y - 6, 12, 12);
    ctx.fillStyle = PAPER; ctx.fillRect(x - 3, y - 3, 6, 6);
    const label = name + " Caltrain";
    ctx.lineWidth = 4; ctx.strokeStyle = PAPER;
    const w = ctx.measureText(label).width;
    // try right, left, below, above; take the first spot clear of the fix markers
    const marks = sel && T.islands[sel] ? topBridges(T, sel).map(e => { const B = T.bridges[e.bid], m = B.pts[Math.floor(B.pts.length / 2)]; return px(m[0], m[1]); }) : [];
    const spots = name === "Burlingame" ? [[x - 10 - w, y - 8], [x + 10, y + 4], [x - w / 2, y + 22], [x - w / 2, y - 14]]
                                        : [[x + 10, y + 4], [x - 10 - w, y + 4], [x - w / 2, y + 22], [x - w / 2, y - 14]];
    const clear = ([sx, sy]) => marks.every(([mx, my]) => mx < sx - 12 || mx > sx + w + 12 || my < sy - 24 || my > sy + 14);
    const [lx, ly] = spots.find(clear) || spots[0];
    ctx.strokeText(label, lx, ly); ctx.fillStyle = INK; ctx.fillText(label, lx, ly);
  }
  // fixes for the selected island, drawn last so labels never cover them
  if (sel && T.islands[sel]) {
    topBridges(T, sel).forEach((e, k) => {
      const B = T.bridges[e.bid];
      if (B.pts.length > 1) stroke(B.pts, INK, 3 * z);
      const m = B.pts[Math.floor(B.pts.length / 2)], [x, y] = px(m[0], m[1]);
      ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.fillStyle = PAPER;
      ctx.beginPath(); ctx.arc(x, y, 10, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = INK; ctx.font = "600 12px 'IBM Plex Sans', sans-serif"; ctx.textAlign = "center";
      ctx.fillText(String(k + 1), x, y + 4); ctx.textAlign = "start";
    });
  }
}

function topBridges(T, id) {
  // one entry per fix, with homes gained for each station it helps
  const by = {};
  (T.islands[id] || {bridges: []}).bridges.forEach(([bid, hu]) => {
    const B = T.bridges[bid], k = B.id;
    by[k] = by[k] || {bid, per: {}};
    by[k].per[B.st] = (by[k].per[B.st] || 0) + hu;
  });
  return Object.values(by)
    .map(e => ({...e, max: Math.max(...Object.values(e.per))}))
    .sort((a, b) => b.max - a.max).slice(0, 5);
}

function share(T, st) {
  let near = 0, ok = 0;
  for (const v of Object.values(T.islands)) { near += (v.near || {})[st] || 0; ok += (v.ok || {})[st] || 0; }
  return [ok, near];
}
function headline() {
  // fixed headline: the cautious-rider finding, whichever standard is showing
  const [ok, near] = share(DATA.strict, "San Mateo");
  const n = Math.round(near / ok);
  document.getElementById("title").textContent =
    `Only 1 in ${n} homes within 2 miles of San Mateo's Caltrain station has a bike route there that feels safe for kids and cautious riders`;
  document.getElementById("subtitle").textContent =
    "Quiet streets form islands, cut off from each other by busy streets and crossings. Pick who's riding, then click near home to see your island and the fixes that would connect it to Caltrain.";
}

function panel() {
  const T = DATA[tier], el = document.getElementById("panel");
  if (!sel) {
    const who = tier === "strict" ? "kids and cautious riders" : "most adults";
    const rows = Object.keys(T.stations).map(st => {
      const [o, n] = share(T, st);
      return `<div class="stat"><div class="lbl">${st} Caltrain: <strong>${pct(o, n)}</strong> of ${fmt(n)} homes within 2 miles have a low-stress route</div><div class="bar"><i style="width:${100 * o / n}%"></i></div></div>`;
    }).join("");
    el.innerHTML = `<h2>Your island</h2><p>Click a street near home. The map lights up every street you can reach from there without riding on, or crossing, a stressful one.</p><p class="muted" style="margin-bottom:4px">For ${who}, across San Mateo and Burlingame:</p>${rows}<p class="muted">The link you share names your island, not the spot you clicked.</p>`;
    return;
  }
  const I = T.islands[sel] || {homes: 0, ok: {}, near: {}, bridges: []};
  let km = 0;
  for (const L of T.lines) if (L.i === sel) for (let k = 1; k < L.pts.length; k++) {
    const a = L.pts[k - 1], b = L.pts[k];
    km += Math.hypot((b[0] - a[0]) * 111, (b[1] - a[1]) * 111 * K);
  }
  let h = `<h2>This island</h2><div><span class="big">${fmt(I.homes)}</span> homes</div><div class="muted">${km.toFixed(1)} km of low-stress streets and paths</div>`;
  for (const st of Object.keys(T.stations)) {
    const n = (I.near || {})[st] || 0, o = (I.ok || {})[st] || 0;
    if (!n) { h += `<div class="stat"><div class="lbl">To ${st} Caltrain: more than a 2-mile ride</div></div>`; continue; }
    const det = (I.det || {})[st], none = (I.none || {})[st] || 0;
    let more = "";
    if (det && det[0]) more += ` For ${fmt(det[0])} more, a low-stress route exists but is too roundabout: typically ${Math.round((det[1] - 1) * 100)}% longer than the direct ride.`;
    if (none) more += ` ${fmt(none)} have no low-stress route at all.`;
    let mins = "";
    if (heat && heatFrom === "where you clicked") {
      const sn = stationNode(T, sel, st);
      if (sn && heat.has(sn.n)) {
        const m = Math.max(1, Math.round((heat.get(sn.n) + sn.d) / M_PER_MIN));
        mins = m > 25 ? `<div style="margin:2px 0 4px">Only by a long detour: <strong>about ${m} minutes</strong> by low-stress streets from where you clicked.</div>`
                      : `<div style="margin:2px 0 4px"><strong>About ${m} minutes</strong> by low-stress streets from where you clicked.</div>`;
      }
    }
    h += `<div class="stat">${mins}<div class="lbl">To ${st} Caltrain: <strong>${fmt(o)} of ${fmt(n)}</strong> homes (${pct(o, n)}) have a low-stress route no more than 25% longer than the direct ride.${more}</div><div class="bar"><i style="width:${100 * o / n}%"></i></div></div>`;
  }
  const list = topBridges(T, sel);
  if (list.length) {
    h += `<h2 style="margin-top:16px">Fixes that would help</h2><ol class="br">`;
    for (const e of list) {
      const B = T.bridges[e.bid];
      const sts = Object.entries(e.per).sort((a, b) => b[1] - a[1]);
      const gains = sts.map(([st, hu], k) => k === 0 ? `${fmt(hu)} more homes here to ${st} Caltrain` : `${fmt(hu)} to ${st} Caltrain`).join(" and ");
      const what = B.kind === "x" ? `Make the crossing at ${B.name} safe` : `Make ${B.name} low-stress (${B.label.split(": ")[1].replace(/ segment.*$/, "")})`;
      h += `<li>${what}: connects ${gains}</li>`;
    }
    h += `</ol>`;
  } else {
    h += `<p class="muted" style="margin-top:12px">None of the single fixes tested would connect more homes on this island.</p>`;
  }
  h += `<p style="margin:14px 0 4px">Is this the right map for you? <button class="askquiz">Take the 7-question quiz</button></p>`;
  h += `<button class="share" id="share">Copy link to this island</button> <span class="muted" id="copied"></span>`;
  el.innerHTML = h;
  document.getElementById("share").onclick = () => {
    navigator.clipboard.writeText(location.href).then(() => document.getElementById("copied").textContent = "Copied");
    track("share_copied", {standard: tier});
  };
}

function setHash() {
  history.replaceState(null, "", sel ? `#t=${tier}&i=${sel}` : `#t=${tier}`);
}
async function applyHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  tier = TIERS.includes(q.get("t")) ? q.get("t") : "strict";
  sel = q.get("i") ? Number(q.get("i")) : null;
  clickPt = null;
  document.querySelectorAll(".seg button[data-tier]").forEach(b => b.setAttribute("aria-pressed", b.dataset.tier === tier));
  if (!DATA[tier]) {
    showLoading();
    try { await ensureTier(tier); }
    catch (err) { tier = "strict"; sel = null; document.querySelectorAll(".seg button[data-tier]").forEach(b => b.setAttribute("aria-pressed", b.dataset.tier === tier)); }
  }
  if (sel && !DATA[tier].lines.some(L => L.i === sel)) sel = null;
  render();
}
function render() {
  document.getElementById("hint").style.display = sel ? "none" : "";
  computeHeat();
  const hl = document.getElementById("heatlegend");
  hl.hidden = !heat;
  if (heat) {
    const labels = [`under ${BANDS[0]}`, ...BANDS.slice(1).map((b, i) => `${BANDS[i]}–${b}`), `${BANDS[BANDS.length - 1]}+`];
    hl.innerHTML = `<span>Minutes by bike from ${heatFrom}, at an easy ${MPH} mph:</span>` +
      labels.map((t, i) => `<span><b style="opacity:${ALPHA[i]}"></b>${t}</span>`).join("") +
      `<span class="muted">No hills or waits at lights counted.</span>`;
  }
  mapnote();
  headline(); panel(); draw();
}

function otherStandardAt() {
  // the island at the same spot under the other standard, if its data is loaded
  const other = tier === "strict" ? "standard" : "strict", T2 = DATA[other];
  if (!T2 || !sel) return null;
  const T = DATA[tier], L0 = T.lines.find(L => L.i === sel);
  const p = clickPt || L0.pts[Math.floor(L0.pts.length / 2)], [x, y] = px(p[0], p[1]);
  const id = pick(x, y, T2);
  return id ? {other, homes: (T2.islands[id] || {}).homes || 0} : null;
}
function mapnote() {
  const el = document.getElementById("mapnote"), T = DATA[tier];
  document.getElementById("lg-island").innerHTML = sel ? '<i style="border-color:var(--copper)"></i>Your island' :
    '<i style="border-color:#5f87b5"></i><i style="border-color:#6e9f68;margin-left:-4px"></i><i style="border-color:#a27aa8;margin-left:-4px"></i>Each color is one island';
  document.getElementById("lg-other").innerHTML = sel ? '<i style="border-color:var(--grey)"></i>Other low-stress streets' :
    '<i style="border-color:var(--grey)"></i>Small islands';
  if (!sel) {
    el.innerHTML = `Each color is an island: quiet streets you can ride between without riding on, or crossing, a stressful street. ` +
      `The dark lines between them are the stressful streets and crossings. <strong>Click near home to see yours.</strong>`;
    return;
  }
  const I = T.islands[sel] || {};
  const parts = [];
  for (const st of Object.keys(T.stations)) {
    if (!((I.near || {})[st])) continue;                 // more than a 2-mile ride: leave it out
    const sn = stationNode(T, sel, st);
    if (sn && heat && heat.has(sn.n) && heatFrom === "where you clicked")
    {
      const m = Math.max(1, Math.round((heat.get(sn.n) + sn.d) / M_PER_MIN));
      parts.push(m > 25 ? `${st} Caltrain only by a long detour (about ${m} min)` : `${st} Caltrain about ${m} min`);
    }
    else if (!sn) parts.push(`${st} Caltrain not reachable`);
  }
  let h = `<strong>Colored streets are the ones you can reach from ${heatFrom === "where you clicked" ? "where you clicked" : "this island"}</strong> without riding on, or crossing, a stressful street` +
          ` (${fmt(I.homes || 0)} homes). ` + (parts.length ? parts.join(" · ") + "." : "");
  const o = otherStandardAt();
  if (o && tier === "standard") h += ` <span class="muted">For kids and cautious riders, this spot's island shrinks to ${fmt(o.homes)} homes.</span>`;
  if (o && tier === "strict" && o.homes > (I.homes || 0)) h += ` <span class="muted">For most adults, it grows to ${fmt(o.homes)} homes.</span>`;
  el.innerHTML = h;
}

function pick(cx, cy, T) {
  T = T || DATA[tier];
  let best = null, bd = 30;
  for (const L of T.lines) {
    if (L.i === undefined) continue;
    for (let k = 1; k < L.pts.length; k++) {
      const [x1, y1] = px(...L.pts[k - 1]), [x2, y2] = px(...L.pts[k]);
      const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
      const t = l2 ? Math.max(0, Math.min(1, ((cx - x1) * dx + (cy - y1) * dy) / l2)) : 0;
      const d = Math.hypot(cx - x1 - t * dx, cy - y1 - t * dy);
      if (d < bd) { bd = d; best = L.i; }
    }
  }
  return best;
}

// interaction: drag to pan, wheel or buttons to zoom, click to pick
let drag = null, moved = false;
cv.addEventListener("pointerdown", e => { drag = [e.clientX, e.clientY, ox, oy]; moved = false; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag[0], dy = e.clientY - drag[1];
  if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
  ox = drag[2] + dx; oy = drag[3] + dy; draw();
});
cv.addEventListener("pointerup", e => {
  if (drag && !moved) {
    const r = cv.getBoundingClientRect();
    sel = pick(e.clientX - r.left, e.clientY - r.top);
    clickPt = sel ? unpx(e.clientX - r.left, e.clientY - r.top) : null;
    document.getElementById("hint").style.display = sel ? "none" : "";
    if (sel) {
      const h = (DATA[tier].islands[sel] || {}).homes || 0;
      track("island_selected", {standard: tier, island_homes: h < 500 ? "under 500" : h <= 5000 ? "500-5000" : "over 5000"});
    }
    setHash(); render();
  }
  drag = null;
});
function zoomAt(f, cx, cy) {
  const ns = Math.max(1, Math.min(12, scale * f)); f = ns / scale;
  ox = cx - W / 2 - (cx - W / 2 - ox) * f; oy = cy - H / 2 - (cy - H / 2 - oy) * f;
  scale = ns; draw();
}
cv.addEventListener("wheel", e => { e.preventDefault(); const r = cv.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.25 : 0.8, e.clientX - r.left, e.clientY - r.top); }, {passive: false});
document.getElementById("zin").onclick = () => zoomAt(1.5, W / 2, H / 2);
document.getElementById("zout").onclick = () => zoomAt(1 / 1.5, W / 2, H / 2);
let riderSource = "card";  // set to "quiz" while the quiz result switches the standard
document.querySelectorAll(".seg button[data-tier]").forEach(b => b.onclick = async () => {
  track("rider_chosen", {standard: b.dataset.tier, source: riderSource});
  // island ids differ between standards; keep the selection by re-picking at the same spot
  const prev = sel && DATA[tier].lines.find(L => L.i === sel);
  const want = b.dataset.tier;
  document.querySelectorAll(".seg button[data-tier]").forEach(x => x.setAttribute("aria-pressed", x === b));
  if (!DATA[want]) {
    showLoading();
    try { await ensureTier(want); }
    catch (err) {
      document.querySelectorAll(".seg button[data-tier]").forEach(x => x.setAttribute("aria-pressed", x.dataset.tier === tier));
      document.getElementById("panel").innerHTML = '<h2>Your island</h2><p>The map for most adults didn\'t load. Check your connection and try again.</p>';
      return;
    }
  }
  tier = want;
  if (prev) {
    const m = clickPt || prev.pts[Math.floor(prev.pts.length / 2)], [x, y] = px(m[0], m[1]);
    sel = pick(x, y);
  }
  setHash(); render();
});

// --- quiz ---
// Part A: verbatim items from Dill & McNeil's national survey (TRR 2587, 2016), used to give
// the reader's national cyclist type. Part B: this map's own items, each testing one rule
// that differs between the two standards. The map standard uses A1 plus all of part B.
const STEM = "For each of the following places you could ride a bike, please indicate whether you would be comfortable or uncomfortable biking there.";
const MAJOR = "A major urban or suburban street with 4 lanes, on-street parking, traffic speeds of 30–35 mph and ";
const QS = [
  {id: "a1", part: "A", map: true, text: "A quiet residential street with traffic traveling at speeds of 20–25 mph",
   img: "img/q1.jpg", cap: "For example, E Santa Inez Ave, San Mateo. Google Street View, June 2026"},
  {id: "a2", part: "A", text: MAJOR + "no bike lane",
   img: "img/a2.jpg", cap: "For example, N El Camino Real near Tilton Ave, San Mateo (posted 35 mph). Google Street View, June 2026"},
  {id: "a3", part: "A", text: MAJOR + "a striped bike lane",
   img: "img/a3.jpg", cap: "For example, Peninsula Ave near N Humboldt St, San Mateo (posted 35 mph; no on-street parking at this spot). Google Street View, August 2022"},
  {id: "b1", part: "B", map: true, text: "A painted bike lane on a 2-lane street posted 30 mph, with cars passing a few feet away",
   img: "img/q2.jpg", cap: "For example, N San Mateo Dr, San Mateo (posted 30 mph; half of drivers go faster than 27). Google Street View, June 2026"},
  {id: "b2", part: "B", map: true, text: "Sharing the lane with cars on a busier 2-lane street posted 25 mph, with no bike lane",
   img: "img/q3.jpg", cap: "For example, N Delaware St, San Mateo (posted 25 mph; half of drivers go faster than 29). Google Street View, June 2026"},
  {id: "b3", part: "B", map: true, text: "Crossing a street posted 30 mph where there's no stop sign or light for the cars",
   img: "img/q4.jpg", cap: "For example, crossing Peninsula Ave at Lorton Ave, Burlingame (posted 30 mph; half of drivers go faster than 26). Google Street View, June 2026"},
  {id: "b4", part: "B", map: true, text: "Crossing El Camino Real at a traffic light",
   img: "img/q5.jpg", cap: "For example, El Camino Real at Bellevue Ave, San Mateo. Google Street View, June 2026"},
];
const OPTS = ["Very comfortable", "Somewhat comfortable", "Somewhat uncomfortable", "Very uncomfortable"];
const dlg = document.getElementById("quiz"), qb = document.getElementById("qbody");
let step = 0, ans = {};
function qrender() {
  const top = (label) => `<div class="qtop"><span>${label}</span><button aria-label="Close" id="qclose">&times;</button></div>`;
  if (step < QS.length) {
    const q = QS[step];
    qb.innerHTML = top(`Question ${step + 1} of ${QS.length}`) +
      `<div class="qprog"><i style="width:${100 * step / QS.length}%"></i></div>` +
      `<p class="qstem">How comfortable would you feel biking here?</p>` +
      `<p class="qtext">${q.text}</p>` +
      (q.img ? `<figure style="margin:0"><img src="${q.img}" alt=""><figcaption>${q.cap}</figcaption></figure>` : "") +
      `<div class="answers">${OPTS.map((t, i) => `<button data-v="${i + 1}" class="${ans[q.id] === i + 1 ? "on" : ""}">${t}</button>`).join("")}</div>` +
      `<div class="qnav"><span>${step ? '<button id="qback">Back</button>' : ""}</span></div>`;
    qb.querySelectorAll(".answers button").forEach(b => b.onclick = () => { ans[q.id] = Number(b.dataset.v); step++; qrender(); });
    if (step) document.getElementById("qback").onclick = () => { step--; qrender(); };
  } else {
    const adult = QS.filter(q => q.map).every(q => ans[q.id] <= 2);
    const typeName = ans.a2 === 1 ? "strong and fearless" : ans.a3 === 1 ? "enthused and confident" : "interested but concerned";
    if (!quizDone) { quizDone = true; track("quiz_completed", {standard: adult ? "standard" : "strict", cyclist_type: typeName}); }
    const t = adult ? "standard" : "strict";
    let msg = adult
      ? "<p>Your map: <strong>most adults</strong>. You'd be comfortable on every kind of street and crossing it counts.</p>"
      : "<p>Your map: <strong>kids and cautious riders</strong>. The other map counts at least one kind of street or crossing you'd be uncomfortable on.</p>";
    if (ans.a1 >= 3) msg += "<p>Even quiet residential streets feel uncomfortable to you, so the map may still show more routes than you'd use.</p>";
    const type = ans.a2 === 1 ? "strong and fearless" : ans.a3 === 1 ? "enthused and confident" : "interested but concerned";
    msg += `<p class="muted">In Dill and McNeil's national survey, your answers to questions 2 and 3 would make you "${type}."</p>`;
    qb.innerHTML = top("Your result") + `<div class="qprog"><i style="width:100%"></i></div><div class="qresult">${msg}</div>` +
      `<button class="go" id="qgo">Show my map</button><div class="qnav"><button id="qback">Back</button><button id="qagain">Start over</button></div>`;
    document.getElementById("qgo").onclick = () => {
      riderSource = "quiz";
      const b = document.querySelector(`.seg button[data-tier="${t}"]`);
      if (tier !== t) b.click();
      dlg.close();
      document.getElementById("mapbox").scrollIntoView({behavior: "smooth", block: "center"});
    };
    document.getElementById("qback").onclick = () => { step--; qrender(); };
    document.getElementById("qagain").onclick = () => { step = 0; ans = {}; quizDone = false; qrender(); };
  }
  document.getElementById("qclose").onclick = () => dlg.close();
  qb.focus({preventScroll: true});  // focus the dialog, not an answer, so nothing looks preselected
}
let quizDone = false;
function openQuiz(source) { step = 0; ans = {}; quizDone = false; qrender(); dlg.showModal(); track("quiz_opened", {source}); }
document.getElementById("openquiz").onclick = () => openQuiz("card");
document.getElementById("panel").addEventListener("click", e => { if (e.target.closest(".askquiz")) openQuiz("panel"); });
dlg.addEventListener("close", () => {
  if (!quizDone) track("quiz_abandoned", {last_question: step + 1});
  riderSource = "card";
});
// links that leave maxmautner.com
document.addEventListener("click", e => {
  const a = e.target.closest("a[href]");
  if (!a) return;
  try {
    const u = new URL(a.getAttribute("href"), location.href);
    if (u.protocol.startsWith("http") && u.hostname !== location.hostname)
      track("outbound_clicked", {link_url: u.href, link_text: a.textContent.trim().slice(0, 100)});
  } catch (err) { /* not a URL */ }
});
window.addEventListener("resize", fit);
new MutationObserver(() => { palette(); draw(); }).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});
window.addEventListener("hashchange", applyHash);
fit(); applyHash();
</script>
</body>
