/*HEAD*/
<style>
  /* One reading column; the map sits beside the headline numbers on wide screens, under them on phones.
     Page colors map onto maxmautner.com's tokens (site.css), as on the map page, so the dark-mode toggle works. */
  :root { --ink: var(--text); --body: var(--text-2); --grey: var(--text-3); --faint: var(--surface-sunken);
          --copper: var(--accent); --card: var(--surface); --can: #2f7d5b; --fix: #2b59c3; --plan: #2f7f73; --park: #dcebd9; --quiet: #c9c3b8; }
  :root[data-theme="dark"] { --can: #5cb98d; --fix: #7c9cf0; --plan: #4fb3a4; --park: #2a3a2a; --quiet: #4a463f; }
  html, body { overflow-x: hidden; }
  main.bp { max-width: 1060px; margin: 0 auto; padding: 0 20px 48px; font-family: var(--font-sans); color: var(--body); }
  main.bp [hidden] { display: none !important; }
  .crumb { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--grey); margin: 8px 0 6px; }
  .crumb a { color: inherit; }
  main.bp h1 { font-family: var(--font-serif); font-weight: 600; color: var(--ink); font-size: clamp(30px, 5vw, 44px); line-height: 1.1; margin: 0 0 14px; text-wrap: balance; }
  main.bp h2 { font-family: var(--font-serif); font-weight: 600; color: var(--ink); font-size: 26px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; }
  main.bp h3 { font-size: 16px; color: var(--ink); margin: 0 0 4px; font-weight: 600; }
  .top { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 32px; align-items: start; }
  @media (max-width: 820px) { .top { grid-template-columns: 1fr; } }
  .lede { font-size: 18px; line-height: 1.5; max-width: 34ch; margin: 0 0 20px; }
  .lede strong { color: var(--ink); font-weight: 600; }
  .bar { height: 14px; display: flex; background: var(--copper); margin: 4px 0 6px; max-width: 420px; }
  .bar i { display: block; background: var(--can); }
  .barlab { display: flex; justify-content: space-between; max-width: 420px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .barlab .c { color: var(--can); } .barlab .x { color: var(--copper); }
  .note { margin-top: 18px; font-size: 14px; color: var(--grey); max-width: 42ch; line-height: 1.5; }
  .mapwrap { position: relative; background: var(--card); border: 1px solid var(--faint); }
  .hint { font-size: 13px; color: var(--grey); padding: 8px 12px 0; margin: 0; }
  canvas { display: block; width: 100%; aspect-ratio: 1 / 1; max-width: 100%; }
  canvas.hit { cursor: pointer; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; padding: 10px 12px; border-top: 1px solid var(--faint); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .ln { width: 18px; height: 3px; display: inline-block; }
  .pop { position: absolute; max-width: min(260px, 80%); background: var(--card); color: var(--body); border: 1px solid var(--grey);
         box-shadow: 0 4px 14px rgba(0,0,0,.18); padding: 8px 30px 8px 10px; font-size: 13px; line-height: 1.4; }
  .pop strong { color: var(--ink); display: block; font-size: 14px; }
  .pop .x { position: absolute; top: 2px; right: 4px; font: inherit; font-size: 18px; line-height: 1; background: none; border: none; color: var(--grey); cursor: pointer; padding: 2px 4px; }
  .pop a { color: var(--fix); }
  .altgroup { border-left: 3px solid var(--fix); padding-left: 10px; margin: 6px 0; }
  .altnote { margin: 0 0 4px; font-size: 14px; color: var(--grey); }
  .num { display: inline-grid; place-items: center; min-width: 22px; padding: 0 3px; box-sizing: border-box; height: 22px; border-radius: 50%; background: var(--fix); color: var(--card);
         font-size: 12px; font-weight: 600; margin-right: 8px; vertical-align: 2px; font-variant-numeric: tabular-nums; }
  main.bp section { margin: 48px 0 0; padding: 0; border: 0; display: block; min-width: 0; }   /* site.css styles bare sections */
  .intro { max-width: 62ch; margin: 0 0 18px; line-height: 1.55; }
  .fixes { display: grid; gap: 10px; }
  .fix { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 16px; align-items: start; text-align: left; width: 100%;
         font: inherit; color: inherit; background: var(--card); border: 1px solid var(--faint); padding: 14px 16px; cursor: pointer; }
  .fix:hover { border-color: var(--grey); }
  .fix[aria-pressed="true"] { border: 2px solid var(--fix); padding: 13px 15px; }
  .fix:focus-visible, .btn:focus-visible { outline: 3px solid var(--fix); outline-offset: 2px; }
  .gain { font-family: var(--font-serif); font-size: 30px; line-height: 1; color: var(--can); font-variant-numeric: tabular-nums; }
  .gain small { display: block; font-family: var(--font-sans); font-size: 12px; color: var(--grey); margin-top: 4px; }
  .fix p { margin: 0; font-size: 15px; line-height: 1.45; }
  .fix .need { margin-top: 6px; font-size: 14px; color: var(--ink); }
  .fix .seen { margin-top: 6px; font-size: 13px; color: var(--grey); }
  .fix .planst { margin-top: 6px; font-size: 13px; color: var(--grey); }
  .fix.plan { border-left: 4px solid var(--plan); }
  .fix.plan[aria-pressed="true"] { border: 2px solid var(--plan); border-left-width: 4px; }
  .together { margin-top: 18px; padding: 16px 18px; background: var(--card); border-left: 4px solid var(--can); max-width: 70ch; }
  .together strong { color: var(--ink); }
  .act-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .act-item { background: var(--card); border: 1px solid var(--faint); padding: 16px 18px; }
  .act-item p { font-size: 15px; line-height: 1.5; margin: 0 0 10px; }
  .act-item a { color: var(--copper); }
  .ask-req { background: var(--bg); border: 1px solid var(--faint); padding: 12px 14px; font-size: 14px; line-height: 1.5; margin: 0 0 10px; white-space: pre-wrap; }
  .btn { font: inherit; font-size: 15px; font-weight: 500; padding: 9px 16px; border: 1px solid var(--copper); background: var(--copper); color: var(--accent-ink); cursor: pointer; text-decoration: none; display: inline-block; }
  .btn.ghost { background: transparent; color: var(--copper); }
  .muted { color: var(--grey); font-size: 13px; }
  .how { margin-top: 48px; font-size: 14px; color: var(--grey); max-width: 70ch; line-height: 1.55; }
  .how h2 { font-size: 18px !important; }
  .how p { margin: 0 0 8px; }
  footer.bi-foot { font-size: 13px; color: var(--text-3); margin-top: 32px; line-height: 1.5; }
  footer.bi-foot a { color: inherit; }
  @media (prefers-reduced-motion: no-preference) { .fix { transition: border-color .15s; } }
</style>
</head>
<body>
<main role="main" class="bp">
/*HEADER*/
/*BODY*/
/*FOOTER*/
</main>
<script>
const PLACE = /*PLACE*/;
const DATA_URL = /*DATAURL*/;
(async function () {
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  let D;
  try { D = await (await fetch(DATA_URL)).json(); } catch (e) { document.getElementById("hint").textContent = "The map didn't load."; return; }
  const M = D.map, FIX = {};
  // the fixes the page lists, labeled as there ("1", "2a"): build_site.py decides which and how
  document.querySelectorAll(".fix[data-n]").forEach(b => {
    const f = D.fixes.find(x => x.id === b.dataset.fix);
    if (f) FIX[f.id] = Object.assign({n: b.dataset.n}, f);
  });
  // the city's project, when the page leads with it (build_site.py decides): drawn in its own color, no number
  document.querySelectorAll(".fix.plan").forEach(b => {
    const p = (D.plans || []).find(x => x.id === b.dataset.fix);
    if (p && p.map) FIX[p.id] = Object.assign({n: "", isPlan: true}, p);
  });
  const cv = document.getElementById("map"), ctx = cv.getContext("2d"), pop = document.getElementById("pop");
  const k = Math.cos(D.center[0] * Math.PI / 180);
  const [s, w, n, e] = M.box;
  let active = null, hover = null, X, Y;
  // a badge for each fix: the point of its stretch nearest the stretch's middle
  const badge = {};
  for (const [id, f] of Object.entries(FIX)) {
    if (f.isPlan) continue;      // the city's project is a line with no badge
    const pts = []; for (const sg of f.map) for (let i = 0; i < sg.length; i += 2) pts.push([sg[i], sg[i + 1]]);
    const m = pts.reduce((a, p) => [a[0] + p[0] / pts.length, a[1] + p[1] / pts.length], [0, 0]);
    badge[id] = pts.reduce((b, p) => Math.hypot(p[0] - m[0], (p[1] - m[1]) * k) < Math.hypot(b[0] - m[0], (b[1] - m[1]) * k) ? p : b);
  }
  function draw() {
    const W = cv.clientWidth, H = cv.clientHeight, dpr = window.devicePixelRatio || 1;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const sc = Math.min(W / ((e - w) * k), H / (n - s));
    const ox = (W - (e - w) * k * sc) / 2, oy = (H - (n - s) * sc) / 2;
    X = lon => ox + (lon - w) * k * sc; Y = lat => oy + (n - lat) * sc;
    const card = css("--card"), ink = css("--ink"), fix = css("--fix"), planc = css("--plan");
    ctx.fillStyle = card; ctx.fillRect(0, 0, W, H);
    const path = a => { ctx.beginPath(); for (let i = 0; i < a.length; i += 2) (i ? ctx.lineTo : ctx.moveTo).call(ctx, X(a[i + 1]), Y(a[i])); };
    const line = (a, col, lw) => { ctx.strokeStyle = col; ctx.lineWidth = lw; path(a); ctx.stroke(); };
    ctx.fillStyle = css("--park");
    for (const r of M.rings) { path(r); ctx.fill(); }
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    const quiet = css("--quiet");
    for (const st of M.streets) if (st[0]) line(st.slice(1), quiet, 0.8);
    for (const st of M.streets) if (!st[0]) line(st.slice(1), ink, 1.4);
    const can = css("--can"), cant = css("--copper");
    ctx.globalAlpha = 0.85;
    for (const [la, lo, ok, people] of M.dots) {      // sized by people ("homes" counts residents)
      if (!people) continue;
      ctx.fillStyle = ok ? can : cant; ctx.beginPath();
      ctx.arc(X(lo), Y(la), Math.max(1.6, Math.sqrt(people) * 0.35), 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const [id, f] of Object.entries(FIX)) {
      const on = id === active || id === hover, fx = f.isPlan ? planc : fix;
      ctx.globalAlpha = active && !on ? 0.35 : 1;
      // a halo under every piece first, then the line, so the short pieces read as one stretch
      for (const sg of f.map) if (sg.length > 2) line(sg, card, on ? 8 : 5);
      for (const sg of f.map) {
        if (sg.length === 2) { ctx.fillStyle = fx; ctx.beginPath(); ctx.arc(X(sg[1]), Y(sg[0]), on ? 7 : 5, 0, 7); ctx.fill(); continue; }
        line(sg, fx, on ? 5 : 2.5);
      }
    }
    ctx.globalAlpha = 1;
    // the place: its name at its center, and a ring where it has no outline
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (!M.rings.length) { ctx.strokeStyle = ink; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(X(0), Y(0), 8, 0, 7); ctx.stroke(); }
    ctx.font = "600 13px " + (css("--font-sans") || "sans-serif");
    ctx.lineWidth = 4; ctx.strokeStyle = card; ctx.strokeText(PLACE, X(0), Y(0) + (M.rings.length ? 0 : 18));
    ctx.fillStyle = ink; ctx.fillText(PLACE, X(0), Y(0) + (M.rings.length ? 0 : 18));
    for (const [id, [la, lo]] of Object.entries(badge)) {
      const on = id === active || id === hover, r = on ? 13 : 11;
      ctx.globalAlpha = active && !on ? 0.5 : 1;
      ctx.fillStyle = fix; ctx.strokeStyle = card; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(X(lo), Y(la), r, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = card; ctx.font = `600 ${on ? 13 : 12}px sans-serif`;
      ctx.fillText(FIX[id].n, X(lo), Y(la) + 0.5);
    }
    ctx.globalAlpha = 1;
  }
  const segd = (px, py, ax, ay, bx, by) => { const L = (bx - ax) ** 2 + (by - ay) ** 2;
    const t = L ? Math.max(0, Math.min(1, ((px - ax) * (bx - ax) + (py - ay) * (by - ay)) / L)) : 0;
    return Math.hypot(px - ax - t * (bx - ax), py - ay - t * (by - ay)); };
  function hit(px, py) {
    for (const [id, [la, lo]] of Object.entries(badge)) if (Math.hypot(px - X(lo), py - Y(la)) < 15) return {fix: id};
    let best = null, bd = 9;
    for (const [id, f] of Object.entries(FIX)) for (const sg of f.map) {
      if (sg.length === 2) { const d = Math.hypot(px - X(sg[1]), py - Y(sg[0])); if (d < bd) { bd = d; best = {fix: id}; } continue; }
      for (let i = 2; i < sg.length; i += 2) {
        const d = segd(px, py, X(sg[i - 1]), Y(sg[i - 2]), X(sg[i + 1]), Y(sg[i]));
        if (d < bd) { bd = d; best = {fix: id}; }
      }
    }
    if (best) return best;
    let dot = null, dd = 1e9;
    for (const d of M.dots) {
      if (!d[3]) continue;
      const r = Math.max(4, Math.sqrt(d[3]) * 0.35 + 3), q = Math.hypot(px - X(d[1]), py - Y(d[0]));
      if (q < r && q < dd) { dd = q; dot = d; }
    }
    return dot ? {dot} : null;
  }
  function place(px, py) {
    pop.hidden = false;
    const pw = pop.offsetWidth, ph = pop.offsetHeight;
    pop.style.left = Math.max(6, Math.min(cv.clientWidth - pw - 6, px - pw / 2)) + "px";
    pop.style.top = (cv.offsetTop + (py - ph - 14 > 0 ? py - ph - 14 : py + 14)) + "px";
  }
  function closeBtn() { const b = pop.querySelector(".x"); if (b) b.onclick = () => { pop.hidden = true; select(null); }; }
  function select(id, scrollCard) {
    active = id;
    document.querySelectorAll(".fix").forEach(x => x.setAttribute("aria-pressed", x.dataset.fix === id));
    draw();
  }
  function showFix(id) {
    const f = FIX[id];
    let [la, lo] = badge[id] || [0, 0];
    if (!badge[id]) {        // a project has no badge: put the note at the middle of its longest line
      const L = f.map.reduce((a, b) => b.length > a.length ? b : a, []), i = Math.floor(L.length / 4) * 2;
      [la, lo] = [L[i], L[i + 1]];
    }
    const title = document.querySelector(`.fix[data-fix="${CSS.escape(id)}"] h3`).textContent.replace(/^\d+/, "");
    pop.innerHTML = `<button class="x" aria-label="Close">&times;</button><strong>${f.n ? f.n + ". " : ""}${title}</strong>` +
      (f.isPlan ? `` : `${f.homes.toLocaleString()} more people could bike here. `) +
      `<a href="#" data-go="1">${f.isPlan ? "More about it" : "What it would need"}</a>`;
    closeBtn();
    pop.querySelector("[data-go]").onclick = ev => { ev.preventDefault();
      document.querySelector(`.fix[data-fix="${CSS.escape(id)}"]`).scrollIntoView({behavior: "smooth", block: "center"}); };
    place(X(lo), Y(la));
  }
  cv.addEventListener("click", ev => {
    const r = cv.getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top, h = hit(px, py);
    if (h && h.fix) { select(h.fix); showFix(h.fix); return; }
    if (h && h.dot) {
      const [, , ok, people, kids] = h.dot;
      pop.innerHTML = `<button class="x" aria-label="Close">&times;</button><strong>${people} ${people === 1 ? "person" : "people"} on this block</strong>` +
        (kids ? `${kids} of them kids. ` : "") +
        (ok ? `They can bike to ${PLACE} on quiet streets.` : `They can't bike to ${PLACE} without riding on a busy street.`);
      closeBtn(); place(px, py); return;
    }
    pop.hidden = true; select(null);
  });
  cv.addEventListener("mousemove", ev => {
    const r = cv.getBoundingClientRect(), h = hit(ev.clientX - r.left, ev.clientY - r.top);
    cv.classList.toggle("hit", !!h);
    const hv = h && h.fix ? h.fix : null;
    if (hv !== hover) { hover = hv; draw(); }
  });
  cv.addEventListener("mouseleave", () => { if (hover) { hover = null; draw(); } });
  document.querySelectorAll(".fix").forEach(b => b.addEventListener("click", () => {
    const id = active === b.dataset.fix ? null : b.dataset.fix;
    select(id);
    if (id) { showFix(id); cv.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest"}); }
    else pop.hidden = true;
  }));
  draw();
  addEventListener("resize", () => { pop.hidden = true; draw(); });
  new MutationObserver(draw).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});
})();
const copyBtn = document.getElementById("askcopy");
if (copyBtn) copyBtn.addEventListener("click", async () => {
  const msg = document.getElementById("askcopied"), req = document.getElementById("askreq");
  try { await navigator.clipboard.writeText(req.textContent); msg.textContent = "Copied"; }
  catch (err) { getSelection().selectAllChildren(req); msg.textContent = "Selected; copy it with your keyboard"; }
});
const shareBtn = document.getElementById("share");
if (shareBtn) shareBtn.addEventListener("click", async () => {
  const msg = document.getElementById("copied");
  if (navigator.share && matchMedia("(pointer: coarse)").matches) { try { await navigator.share({title: document.title, url: location.href}); return; } catch (err) { if (err.name === "AbortError") return; } }
  try { await navigator.clipboard.writeText(location.href); msg.textContent = "Copied"; } catch (err) { msg.textContent = location.href; }
});
</script>
</body>
</html>
